<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · CoderHelm</title>
  <style>
    :root{--bg:#fafafa;--fg:#111;--muted:#5c5c66;--line:#e4e4e7;--brand:#2563eb;--on-brand:#fff;--card:#fff}
    @media (prefers-color-scheme:dark){:root{--bg:#0a0a0b;--fg:#f4f4f5;--muted:#a1a1aa;--line:#27272a;--brand:#60a5fa;--on-brand:#0b1220;--card:#111113}}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:grid;place-items:center;min-height:100vh;padding:24px 16px}
    main{max-width:480px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
    .code{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
    h1{font-size:24px;line-height:1.25;letter-spacing:-.02em;margin-bottom:10px}
    p{color:var(--muted);margin-bottom:24px}
    a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:var(--brand);color:var(--on-brand);text-decoration:none;border-radius:10px;font-weight:600}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page doesn&rsquo;t exist</h1>
    <p>The link may be old or mistyped. Everything in CoderHelm starts from its home page.</p>
    <a href="/">Open CoderHelm</a>
  </main>
</body>
</html>
