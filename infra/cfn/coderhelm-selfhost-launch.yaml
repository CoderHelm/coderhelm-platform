AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Installs CoderHelm in this AWS account (about 20 minutes). It creates: a
  permissions boundary that caps every CoderHelm role (no IAM users or keys,
  no IAM outside coderhelm-<name>-*, no Organizations, CloudTrail or
  GuardDuty changes, no other roles in this account); a deploy role only
  CloudFormation can use, limited to resources named or tagged for this
  install; and an installer (CodeBuild) whose role has no deploy rights
  until a check gives this one verified build a window that ends with it.
  Risks: whoever can change CoderHelm's functions or start its verified
  builds can act within that boundary; a malicious release could change any
  CoderHelm resource and a few unnamed CloudFront and API Gateway settings
  in this region, but cannot create an admin role or touch IAM elsewhere.
  The boundary, deploy role and assets bucket stay when this stack is
  deleted, and CoderHelm keeps running. docs.coderhelm.com/self-host/security

Metadata:
  # E6101: cfn-lint types a WaitCondition's Data as an object; it is a JSON
  # string, and an output of it is the documented pattern.
  cfn-lint:
    config:
      ignore_checks: [E6101]
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "You" }
        Parameters: [AdminEmail]
      - Label: { default: "Install" }
        Parameters: [Stage, ModelProvider, Version]
      - Label: { default: "Optional: your own domain (leave empty to use a free CloudFront address)" }
        Parameters: [Hostname, HostedZone]
      - Label: { default: "Who may join (this install is for one organization; change these later in Settings, Sign-in)" }
        Parameters: [SignupDomain, RequireTwoFactor]
      - Label: { default: "Optional" }
        Parameters: [EmailTransport, EmailFrom, BedrockInferencePrefix, Telemetry]
      - Label: { default: "Optional: updates (you can change these later in Settings, System)" }
        Parameters: [AutoUpdate, UpdateWindow, UpdateTimezone]
      - Label: { default: "Filled in by the install guide (leave as they are)" }
        Parameters: [StatusId, SetupToken]
    ParameterLabels:
      AdminEmail: { default: "Your email" }
      Stage: { default: "Install name" }
      ModelProvider: { default: "Models" }
      Version: { default: "CoderHelm release" }
      Hostname: { default: "Hostname" }
      HostedZone: { default: "Route 53 hosted zone" }
      EmailTransport: { default: "Send email" }
      EmailFrom: { default: "Send email from" }
      SignupDomain: { default: "Let people from your company join" }
      RequireTwoFactor: { default: "Require two-factor sign-in" }
      BedrockInferencePrefix: { default: "Bedrock inference profile" }
      Telemetry: { default: "Anonymous install pings" }
      AutoUpdate: { default: "Install new releases by themselves" }
      UpdateWindow: { default: "Maintenance window" }
      UpdateTimezone: { default: "Time zone of the window" }
      StatusId: { default: "Progress ID" }
      SetupToken: { default: "Setup key" }

Parameters:
  AdminEmail:
    Type: String
    Description: You become the first admin. Sign up with this address when the install finishes.
    AllowedPattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
    ConstraintDescription: an email address
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z][a-z0-9-]{0,19}$"
    ConstraintDescription: lowercase letters, digits and hyphens, starting with a letter, at most 20
    Description: A short name for this install. Resource names start with coderhelm-<name>.
  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, anthropic]
    Description: bedrock (Claude on Amazon Bedrock in this account, no API key) or anthropic (each team adds its own Anthropic API key). You can change this later in Settings, System.
  Version:
    Type: String
    # Stamped with the release's own tag when the release is published
    # (selfhost/launch/stamp-template.mjs); "latest" in the repository.
    Default: latest
    Description: The CoderHelm release to install, e.g. v0.7.0.
    AllowedPattern: "^(latest|v\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.]+)?)$"
  Hostname:
    Type: String
    Default: ""
    Description: >
      e.g. coderhelm.example.com. Empty for a free CloudFront address (you can add a domain later in Settings, System).
      A Route 53 zone in this account is found and set up for you; with any other DNS provider the install guide
      shows the two records to add, and CoderHelm moves to the domain once they are in place.
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
  HostedZone:
    Type: String
    Default: ""
    Description: Leave empty (the zone is found in this account). Only to pick one, e.g. example.com.
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
  EmailTransport:
    Type: String
    Default: ses
    AllowedValues: [ses, coderhelm]
    Description: "ses: through this account's Amazon SES (the default). coderhelm: through CoderHelm's mail service (hybrid; CoderHelm sees each recipient's address and the email's parameters, and keeps only delivery metadata)."
  EmailFrom:
    Type: String
    Default: ""
    Description: The address CoderHelm sends email from. Empty uses your email (AWS emails it a link to confirm; no DNS needed).
    AllowedPattern: "^$|^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
  SignupDomain:
    Type: String
    Default: ""
    Description: >
      Empty (the default) means only people you invite. Or an email domain, e.g. example.com: anyone with an email
      there may join. This install is for one organization only; nobody else can sign up.
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
  RequireTwoFactor:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: on makes everyone set up an authenticator app before they can use CoderHelm, you included.
  BedrockInferencePrefix:
    Type: String
    Default: auto
    AllowedValues: ["auto", "us.", "eu.", "apac.", "global.", ""]
    Description: Bedrock only. auto picks the cross-region inference profile for this region.
  Telemetry:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: Send anonymous install pings (release and region only) to CoderHelm.
  AutoUpdate:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: on installs each new release in the maintenance window (health checked, rolled back if unhealthy). off emails the admins about each release.
  UpdateWindow:
    Type: String
    Default: "Sun 03:00"
    AllowedPattern: "^((Mon|Tue|Wed|Thu|Fri|Sat|Sun|daily) ([01]\\d|2[0-3]):00)$"
    ConstraintDescription: a day (or daily) and an hour, e.g. Sun 03:00 or daily 02:00
    Description: When updates may run, e.g. Sun 03:00 or daily 02:00.
  UpdateTimezone:
    Type: String
    Default: UTC
    AllowedPattern: "^(UTC|[A-Za-z_]+(/[A-Za-z0-9_+-]+)+)$"
    ConstraintDescription: an IANA time zone such as Europe/Berlin
    Description: The window's time zone, e.g. Europe/Berlin.
  StatusId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9]{16}$"
    Description: >
      Lets the install guide in your browser show progress. The installer writes
      its phase and your CoderHelm URL (nothing else) to a small bucket in this
      account that the guide reads. Empty for none.
  SetupToken:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9]{32,64}$"
    Description: >
      A one-time key from the install guide. It lets the guide hand your new
      GitHub App's keys straight to your install. It stops working once the
      app exists. Empty to create the GitHub App with the CLI instead.

Conditions:
  HasHostname: !Not [!Equals [!Ref Hostname, ""]]
  HasStatus: !Not [!Equals [!Ref StatusId, ""]]

Resources:
  # Progress for the install guide: one public file, status.json, with the
  # phase, a plain message and the install's URL. The bucket outlives the
  # stack so a failed install's reason stays readable; the file expires.
  StatusBucket:
    Type: AWS::S3::Bucket
    Condition: HasStatus
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub coderhelm-setup-${StatusId}
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: expire-progress
            Status: Enabled
            ExpirationInDays: 30

  # ── Generated from infra/lib/access.ts (infra/lib/launch-access.ts): do not edit by hand ──
  Boundary:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {
        "ManagedPolicyName": {
          "Fn::Sub": [
            "coderhelm-${Stage}-boundary-${Id}",
            {
              "Id": {
                "Fn::Select": [
                  0,
                  {
                    "Fn::Split": [
                      "-",
                      {
                        "Fn::Select": [
                          2,
                          {
                            "Fn::Split": [
                              "/",
                              {
                                "Ref": "AWS::StackId"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            }
          ]
        },
        "Description": "CoderHelm: the most any CoderHelm role can do (docs/self-host/security.md)",
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "CoderHelmServices",
              "Effect": "Allow",
              "Action": [
                "acm:*",
                "apigateway:*",
                "bedrock:InvokeModel",
                "bedrock:InvokeModelWithResponseStream",
                "bedrock:Get*",
                "bedrock:List*",
                "cloudformation:*",
                "cloudfront:*",
                "cloudwatch:*",
                "codebuild:*",
                "cognito-idp:*",
                "dynamodb:*",
                "events:*",
                "kms:*",
                "lambda:*",
                "logs:*",
                "route53:*",
                "s3:*",
                "scheduler:*",
                "secretsmanager:*",
                "ses:*",
                "sns:*",
                "sqs:*",
                "ssm:*",
                "sts:AssumeRole",
                "sts:GetCallerIdentity"
              ],
              "Resource": "*"
            },
            {
              "Sid": "InstallRoleWrites",
              "Effect": "Allow",
              "Action": [
                "iam:CreateRole",
                "iam:PutRolePolicy",
                "iam:AttachRolePolicy",
                "iam:DetachRolePolicy",
                "iam:DeleteRolePolicy",
                "iam:PutRolePermissionsBoundary"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
              },
              "Condition": {
                "StringEquals": {
                  "iam:PermissionsBoundary": {
                    "Fn::Sub": [
                      "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-boundary-${Id}",
                      {
                        "Id": {
                          "Fn::Select": [
                            0,
                            {
                              "Fn::Split": [
                                "-",
                                {
                                  "Fn::Select": [
                                    2,
                                    {
                                      "Fn::Split": [
                                        "/",
                                        {
                                          "Ref": "AWS::StackId"
                                        }
                                      ]
                                    }
                                  ]
                                }
                              ]
                            }
                          ]
                        }
                      }
                    ]
                  }
                }
              }
            },
            {
              "Sid": "InstallRoles",
              "Effect": "Allow",
              "Action": [
                "iam:DeleteRole",
                "iam:GetRole",
                "iam:GetRolePolicy",
                "iam:ListRolePolicies",
                "iam:ListAttachedRolePolicies",
                "iam:ListRoleTags",
                "iam:UpdateRole",
                "iam:UpdateRoleDescription",
                "iam:UpdateAssumeRolePolicy",
                "iam:TagRole",
                "iam:UntagRole",
                "iam:PassRole"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
              }
            },
            {
              "Sid": "InstallPolicies",
              "Effect": "Allow",
              "Action": [
                "iam:CreatePolicy",
                "iam:DeletePolicy",
                "iam:CreatePolicyVersion",
                "iam:DeletePolicyVersion",
                "iam:GetPolicy",
                "iam:GetPolicyVersion",
                "iam:ListPolicyVersions",
                "iam:ListEntitiesForPolicy",
                "iam:TagPolicy",
                "iam:UntagPolicy"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-*"
              }
            },
            {
              "Sid": "NoIamUsersOrKeys",
              "Effect": "Deny",
              "Action": [
                "iam:CreateUser",
                "iam:CreateAccessKey",
                "iam:UpdateAccessKey",
                "iam:CreateLoginProfile",
                "iam:UpdateLoginProfile",
                "iam:AttachUserPolicy",
                "iam:PutUserPolicy",
                "iam:AddUserToGroup",
                "iam:CreateGroup",
                "iam:PutGroupPolicy",
                "iam:AttachGroupPolicy",
                "iam:CreateServiceSpecificCredential",
                "iam:UploadSSHPublicKey",
                "iam:CreateOpenIDConnectProvider",
                "iam:CreateSAMLProvider",
                "iam:UpdateAccountPasswordPolicy",
                "iam:CreateAccountAlias"
              ],
              "Resource": "*"
            },
            {
              "Sid": "NoAccountGuardrailChanges",
              "Effect": "Deny",
              "Action": [
                "organizations:*",
                "account:*",
                "cloudtrail:*",
                "guardduty:*"
              ],
              "Resource": "*"
            },
            {
              "Sid": "NoIamOutsideTheInstall",
              "Effect": "Deny",
              "Action": "iam:*",
              "NotResource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-*"
                }
              ]
            },
            {
              "Sid": "RolesOnlyWithTheBoundary",
              "Effect": "Deny",
              "Action": [
                "iam:CreateRole",
                "iam:PutRolePolicy",
                "iam:AttachRolePolicy",
                "iam:DetachRolePolicy",
                "iam:DeleteRolePolicy",
                "iam:PutRolePermissionsBoundary"
              ],
              "Resource": "*",
              "Condition": {
                "StringNotEquals": {
                  "iam:PermissionsBoundary": {
                    "Fn::Sub": [
                      "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-boundary-${Id}",
                      {
                        "Id": {
                          "Fn::Select": [
                            0,
                            {
                              "Fn::Split": [
                                "-",
                                {
                                  "Fn::Select": [
                                    2,
                                    {
                                      "Fn::Split": [
                                        "/",
                                        {
                                          "Ref": "AWS::StackId"
                                        }
                                      ]
                                    }
                                  ]
                                }
                              ]
                            }
                          ]
                        }
                      }
                    ]
                  }
                }
              }
            },
            {
              "Sid": "TheBoundaryStays",
              "Effect": "Deny",
              "Action": [
                "iam:DeleteRolePermissionsBoundary",
                "iam:CreatePolicyVersion",
                "iam:DeletePolicy",
                "iam:DeletePolicyVersion",
                "iam:SetDefaultPolicyVersion",
                "iam:TagPolicy",
                "iam:UntagPolicy"
              ],
              "Resource": [
                {
                  "Fn::Sub": [
                    "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-boundary-${Id}",
                    {
                      "Id": {
                        "Fn::Select": [
                          0,
                          {
                            "Fn::Split": [
                              "-",
                              {
                                "Fn::Select": [
                                  2,
                                  {
                                    "Fn::Split": [
                                      "/",
                                      {
                                        "Ref": "AWS::StackId"
                                      }
                                    ]
                                  }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    }
                  ]
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
                }
              ]
            },
            {
              "Sid": "TheDeployRoleStays",
              "Effect": "Deny",
              "Action": [
                "iam:CreateRole",
                "iam:PutRolePolicy",
                "iam:AttachRolePolicy",
                "iam:DetachRolePolicy",
                "iam:DeleteRolePolicy",
                "iam:PutRolePermissionsBoundary",
                "iam:DeleteRole",
                "iam:UpdateRole",
                "iam:UpdateAssumeRolePolicy",
                "iam:TagRole",
                "iam:UntagRole"
              ],
              "Resource": {
                "Fn::Sub": [
                  "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-deploy-${Id}",
                  {
                    "Id": {
                      "Fn::Select": [
                        0,
                        {
                          "Fn::Split": [
                            "-",
                            {
                              "Fn::Select": [
                                2,
                                {
                                  "Fn::Split": [
                                    "/",
                                    {
                                      "Ref": "AWS::StackId"
                                    }
                                  ]
                                }
                              ]
                            }
                          ]
                        }
                      ]
                    }
                  }
                ]
              }
            },
            {
              "Sid": "TheAccessStackStays",
              "Effect": "Deny",
              "Action": [
                "cloudformation:CreateChangeSet",
                "cloudformation:ExecuteChangeSet",
                "cloudformation:UpdateStack",
                "cloudformation:DeleteStack",
                "cloudformation:CreateStack",
                "cloudformation:SetStackPolicy"
              ],
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/coderhelm-${Stage}-access/*"
              }
            },
            {
              "Sid": "NoOtherRolesHere",
              "Effect": "Deny",
              "Action": [
                "sts:AssumeRole",
                "sts:AssumeRoleWithWebIdentity",
                "sts:AssumeRoleWithSAML",
                "sts:TagSession",
                "sts:SetSourceIdentity"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "aws:ResourceAccount": {
                    "Fn::Sub": "${AWS::AccountId}"
                  }
                }
              }
            }
          ]
        }
      }
  DeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata: {
        "cfn-lint": {
          "config": {
            "ignore_checks": [
              "W3037"
            ]
          }
        }
      }
    Properties: {
        "RoleName": {
          "Fn::Sub": [
            "coderhelm-${Stage}-deploy-${Id}",
            {
              "Id": {
                "Fn::Select": [
                  0,
                  {
                    "Fn::Split": [
                      "-",
                      {
                        "Fn::Select": [
                          2,
                          {
                            "Fn::Split": [
                              "/",
                              {
                                "Ref": "AWS::StackId"
                              }
                            ]
                          }
                        ]
                      }
                    ]
                  }
                ]
              }
            }
          ]
        },
        "Description": "CoderHelm: CloudFormation's role for this install's stacks",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudformation.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "PermissionsBoundary": {
          "Ref": "Boundary"
        },
        "Policies": [
          {
            "PolicyName": "deploy",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "Roles",
                  "Effect": "Allow",
                  "Action": [
                    "iam:CreateRole",
                    "iam:PutRolePolicy",
                    "iam:AttachRolePolicy",
                    "iam:DetachRolePolicy",
                    "iam:DeleteRolePolicy",
                    "iam:PutRolePermissionsBoundary"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:PermissionsBoundary": {
                        "Fn::Sub": [
                          "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-boundary-${Id}",
                          {
                            "Id": {
                              "Fn::Select": [
                                0,
                                {
                                  "Fn::Split": [
                                    "-",
                                    {
                                      "Fn::Select": [
                                        2,
                                        {
                                          "Fn::Split": [
                                            "/",
                                            {
                                              "Ref": "AWS::StackId"
                                            }
                                          ]
                                        }
                                      ]
                                    }
                                  ]
                                }
                              ]
                            }
                          }
                        ]
                      }
                    }
                  }
                },
                {
                  "Sid": "RolesManage",
                  "Effect": "Allow",
                  "Action": [
                    "iam:DeleteRole",
                    "iam:GetRole",
                    "iam:GetRolePolicy",
                    "iam:ListRolePolicies",
                    "iam:ListAttachedRolePolicies",
                    "iam:ListRoleTags",
                    "iam:UpdateRole",
                    "iam:UpdateRoleDescription",
                    "iam:UpdateAssumeRolePolicy",
                    "iam:TagRole",
                    "iam:UntagRole"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
                  }
                },
                {
                  "Sid": "Policies",
                  "Effect": "Allow",
                  "Action": [
                    "iam:CreatePolicy",
                    "iam:DeletePolicy",
                    "iam:CreatePolicyVersion",
                    "iam:DeletePolicyVersion",
                    "iam:GetPolicy",
                    "iam:GetPolicyVersion",
                    "iam:ListPolicyVersions",
                    "iam:ListEntitiesForPolicy",
                    "iam:TagPolicy",
                    "iam:UntagPolicy"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/coderhelm-${Stage}-*"
                  }
                },
                {
                  "Sid": "PassInstallRoles",
                  "Effect": "Allow",
                  "Action": "iam:PassRole",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-*"
                  }
                },
                {
                  "Sid": "Functions",
                  "Effect": "Allow",
                  "Action": "lambda:*",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:coderhelm-${Stage}-*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:coderhelm-${Stage}-*"
                    }
                  ]
                },
                {
                  "Sid": "FunctionEvents",
                  "Effect": "Allow",
                  "Action": [
                    "lambda:CreateEventSourceMapping",
                    "lambda:UpdateEventSourceMapping",
                    "lambda:DeleteEventSourceMapping"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "ArnLike": {
                      "lambda:FunctionArn": {
                        "Fn::Sub": "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:coderhelm-${Stage}-*"
                      }
                    }
                  }
                },
                {
                  "Sid": "Tables",
                  "Effect": "Allow",
                  "Action": "dynamodb:*",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coderhelm-${Stage}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coderhelm-${Stage}/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/coderhelm-${Stage}-*"
                    }
                  ]
                },
                {
                  "Sid": "Buckets",
                  "Effect": "Allow",
                  "Action": "s3:*",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::coderhelm-${Stage}-*"
                    }
                  ]
                },
                {
                  "Sid": "Queues",
                  "Effect": "Allow",
                  "Action": "sqs:*",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:coderhelm-${Stage}-*"
                  }
                },
                {
                  "Sid": "Topics",
                  "Effect": "Allow",
                  "Action": "sns:*",
                  "Resource": {
