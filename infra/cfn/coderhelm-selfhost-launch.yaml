  # The installer's role holds no deploy rights. While a verified install
  # build runs, the window function (below) adds the deploy window to it,
  # bound to that build's session and an end time; the build removes it
  # when it ends, and so does this stack when it is deleted or rolled back.
  InstallerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ["coderhelm-${Stage}-installer-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
      Description: CoderHelm installer (CodeBuild). No deploy rights between installs (docs/self-host/security.md).
      PermissionsBoundary: !Ref Boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: idle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLog
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-installer*
              - Sid: Progress
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::coderhelm-setup-*/status.json
              - Sid: AskForWindow
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub ["arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:coderhelm-${Stage}-window-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
              - Sid: CloseOwnWindow
                Effect: Allow
                Action: iam:DeleteRolePolicy
                Resource: !Sub ["arn:${AWS::Partition}:iam::${AWS::AccountId}:role/coderhelm-${Stage}-installer-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]

  # No log group resource: CodeBuild creates /aws/codebuild/<project> itself,
  # so the log stays when this stack is rolled back or deleted.
  InstallerProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-installer
      Description: Installs CoderHelm from a signed release (coderhelm-selfhost deploy). Updates later run from Settings, System.
      ServiceRole: !GetAtt InstallerRole.Arn
      TimeoutInMinutes: 90
      # One build at a time: the deploy window is for one build only.
      ConcurrentBuildLimit: 1
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: VERSION, Value: !Ref Version }
          - { Name: STAGE, Value: !Ref Stage }
          - { Name: ADMIN_EMAIL, Value: !Ref AdminEmail }
          - { Name: EMAIL_FROM, Value: !Ref EmailFrom }
          - { Name: EMAIL_TRANSPORT, Value: !Ref EmailTransport }
          - { Name: HOSTNAME_ARG, Value: !Ref Hostname }
          - { Name: HOSTED_ZONE, Value: !Ref HostedZone }
          - { Name: MODEL_PROVIDER, Value: !Ref ModelProvider }
          - { Name: BEDROCK_PREFIX, Value: !Ref BedrockInferencePrefix }
          - { Name: SIGNUP_DOMAIN, Value: !Ref SignupDomain }
          - { Name: REQUIRE_TWO_FACTOR, Value: !Ref RequireTwoFactor }
          - { Name: TELEMETRY, Value: !Ref Telemetry }
          - { Name: AUTO_UPDATE, Value: !Ref AutoUpdate }
          - { Name: UPDATE_WINDOW, Value: !Ref UpdateWindow }
          - { Name: UPDATE_TIMEZONE, Value: !Ref UpdateTimezone }
          - { Name: STATUS_BUCKET, Value: !If [HasStatus, !Ref StatusBucket, ""] }
          - { Name: SETUP_TOKEN, Value: !Ref SetupToken }
          - { Name: WAIT_URL, Value: "" }
          - { Name: ACCESS_ID, Value: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }
          - { Name: INSTALLER_ROLE, Value: !Ref InstallerRole }
          - { Name: WINDOW_FUNCTION, Value: !Sub ["coderhelm-${Stage}-window-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }] }
          - { Name: ASSETS_BUCKET, Value: !Ref AssetsBucket }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              runtime-versions:
                nodejs: 20
              commands:
                - set -euo pipefail
                # cosign, pinned by its SHA-256. These lines and the checks below
                # match infra/lib/release-verify.ts (infra/test/launch-stack.test.ts).
                - curl --proto =https --proto-redir =https --tlsv1.2 -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
                - echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  /tmp/cosign" | sha256sum -c -
                - install -m 0755 /tmp/cosign /usr/local/bin/cosign
            build:
              commands:
                - set -euo pipefail
                - REPO=CoderHelm/coderhelm-platform
                - |
                  if [ "$VERSION" = "latest" ]; then
                    VERSION=$(curl --proto =https --proto-redir =https --tlsv1.2 -fsSL "https://api.github.com/repos/$REPO/releases/latest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(r.draft||r.prerelease)process.exit(1);console.log(r.tag_name)})')
                    export VERSION
                  fi
                - '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "VERSION=$VERSION is not a release tag"; exit 1; }'
                - echo "Installing CoderHelm $VERSION"
                - mkdir -p /tmp/ch && cd /tmp/ch
                - B="https://github.com/CoderHelm/coderhelm-platform/releases/download/$VERSION"
                - for f in SHA256SUMS SHA256SUMS.sigstore.json coderhelm-selfhost.tgz launch-bootstrap.mjs; do curl --proto =https --proto-redir =https --tlsv1.2 -fsSL -o "$f" "$B/$f"; done
                # The tag: an annotated tag named $VERSION on a commit on main ($COMMIT), either
                # signed with a maintainer key pinned in selfhost/maintainers.json or attested by
                # auto-release.yml on main for exactly this tag and commit (cosign, installed above).
                - |
                  rm -rf /tmp/ch-tag && mkdir -p /tmp/ch-tag && printf '%s\n' 'nambok namespaces="git" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH6UjRCKMcz6OyGQkv2PCBbzqzKx+ngQQmavwp8UDASV' > /tmp/ch-tag.signers
                - |
                  env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag init -q --bare
                - |
                  env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag fetch -q --no-tags --filter=tree:0 https://github.com/CoderHelm/coderhelm-platform.git "+refs/tags/$VERSION:refs/tags/$VERSION" "+refs/heads/main:refs/heads/main"
                - |
                  [ "$(env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag cat-file -t "refs/tags/$VERSION")" = tag ] || { echo "$VERSION is not an annotated tag"; exit 1; }
                - |
                  env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag cat-file tag "refs/tags/$VERSION" > /tmp/ch-tag.tag
                - |
                  [ "$(sed -n '/^$/q;s/^tag //p' /tmp/ch-tag.tag)" = "$VERSION" ] || { echo "the tag object under $VERSION is named for another version"; exit 1; }
                - |
                  [ "$(sed -n '/^$/q;s/^type //p' /tmp/ch-tag.tag)" = commit ] || { echo "$VERSION does not point to a commit"; exit 1; }
                - |
                  COMMIT=$(env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag rev-parse --verify "refs/tags/$VERSION^{commit}")
                - |
                  [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] && env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag merge-base --is-ancestor "$COMMIT" refs/heads/main || { echo "$VERSION ($COMMIT) is not on main"; exit 1; }
                - |
                  if grep -qxF -e '-----BEGIN SSH SIGNATURE-----' /tmp/ch-tag.tag; then [ "$(grep -cxF -e '-----BEGIN SSH SIGNATURE-----' /tmp/ch-tag.tag)" = 1 ] || { echo "$VERSION has more than one SSH signature"; exit 1; }; env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 git -C /tmp/ch-tag -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=/tmp/ch-tag.signers -c gpg.ssh.program=ssh-keygen verify-tag "refs/tags/$VERSION" || { echo "$VERSION is not signed by a CoderHelm maintainer key (selfhost/maintainers.json)"; exit 1; }; echo "$VERSION is signed by a maintainer key"; else [ "$(grep -cxF -e '-----BEGIN CODERHELM RELEASE ATTESTATION-----' /tmp/ch-tag.tag)" = 1 ] && [ "$(grep -cxF -e '-----END CODERHELM RELEASE ATTESTATION-----' /tmp/ch-tag.tag)" = 1 ] || { echo "$VERSION has no SSH signature and no release attestation"; exit 1; }; sed -n '/^-----BEGIN CODERHELM RELEASE ATTESTATION-----$/,/^-----END CODERHELM RELEASE ATTESTATION-----$/p' /tmp/ch-tag.tag | sed '1d;$d' | base64 -d > /tmp/ch-tag.bundle || { echo "$VERSION's release attestation is not base64"; exit 1; }; printf 'coderhelm-release-tag v1\nrepository %s\ntag %s\ncommit %s\n' CoderHelm/coderhelm-platform "$VERSION" "$COMMIT" > /tmp/ch-tag.statement; cosign verify-blob --bundle /tmp/ch-tag.bundle --certificate-identity "https://github.com/CoderHelm/coderhelm-platform/.github/workflows/auto-release.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository CoderHelm/coderhelm-platform --certificate-github-workflow-ref refs/heads/main --certificate-github-workflow-sha "$COMMIT" /tmp/ch-tag.statement || { echo "$VERSION's release attestation is not from auto-release.yml on main for this tag and commit"; exit 1; }; echo "$VERSION was released by auto-release.yml on main"; fi
                # Signed by exactly this repository's release.yml, on this tag and that commit, logged in Rekor.
                - cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "https://github.com/CoderHelm/coderhelm-platform/.github/workflows/release.yml@refs/tags/$VERSION" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository CoderHelm/coderhelm-platform --certificate-github-workflow-ref "refs/tags/$VERSION" --certificate-github-workflow-sha "$COMMIT" SHA256SUMS
                # Both files, each matched by name: grep finding one is not enough.
                - grep ' coderhelm-selfhost.tgz$' SHA256SUMS | sha256sum -c -
                - grep ' launch-bootstrap.mjs$' SHA256SUMS | sha256sum -c -
                # The deploy window: the window function checks this is this template's
                # build, then lets this build's own session deploy until it ends.
                - WINDOW_USER_ID=$(aws sts get-caller-identity --query UserId --output text)
                - printf '{"build_id":"%s","user_id":"%s"}' "$CODEBUILD_BUILD_ID" "$WINDOW_USER_ID" > /tmp/window.json
                - aws lambda invoke --function-name "$WINDOW_FUNCTION" --cli-binary-format raw-in-base64-out --payload file:///tmp/window.json /tmp/window-out.json > /dev/null
                - |
                  node -e 'const r=require("/tmp/window-out.json");if(r.ok){console.log("Deploy window open until "+r.until);process.exit(0)}const m="AWS refused the installer its deploy window: "+(r.error||r.errorMessage||"no answer");console.error(m);require("fs").writeFileSync("/tmp/coderhelm-final.json",JSON.stringify({schema:1,phase:"failed",message:m,fix:"Delete this stack (nothing was deployed) and launch it again. If it happens again, tell us with this message.",version:process.env.VERSION,stage:process.env.STAGE,region:process.env.AWS_REGION,updatedAt:new Date().toISOString()}));process.exit(1)'
                - for i in $(seq 1 30); do aws s3api head-bucket --bucket "$ASSETS_BUCKET" > /dev/null 2>&1 && break; [ "$i" = 30 ] && { echo "The deploy window did not take effect in 2 minutes"; exit 1; }; sleep 4; done
                - node launch-bootstrap.mjs
            post_build:
              commands:
                # The window ends with the build.
                - aws iam delete-role-policy --role-name "$INSTALLER_ROLE" --policy-name deploy-window > /dev/null 2>&1 || true
                - |
                  if [ -s /tmp/coderhelm-final.json ] && [ -n "$STATUS_BUCKET" ] && grep -q '"phase":"failed"' /tmp/coderhelm-final.json && ! grep -q '"logUrl"' /tmp/coderhelm-final.json; then
                    aws s3 cp /tmp/coderhelm-final.json "s3://$STATUS_BUCKET/status.json" --content-type application/json --cache-control no-store --only-show-errors || true
                  fi
                - |
                  if [ ! -s /tmp/coderhelm-final.json ] && [ -n "$STATUS_BUCKET" ]; then
                    printf '{"schema":1,"phase":"failed","message":"The installer stopped before it could start: the release could not be downloaded or its signature did not check out.","fix":"Check that the release exists, then launch again.","version":"%s","stage":"%s","region":"%s","updatedAt":"%s"}' "$VERSION" "$STAGE" "$AWS_REGION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/coderhelm-final.json
                    aws s3 cp /tmp/coderhelm-final.json "s3://$STATUS_BUCKET/status.json" --content-type application/json --cache-control no-store --only-show-errors || true
                  fi
                - |
                  if [ -n "$WAIT_URL" ]; then
                    # The answer names what failed (an AWS refusal names its action and resource), so the stack's events and the guide show it.
                    node -e 'let f={};try{f=require("/tmp/coderhelm-final.json")}catch{}const ok=process.env.CODEBUILD_BUILD_SUCCEEDING==="1"&&!!f.url;const why=ok?"CoderHelm is running":("The install failed: "+(f.message||"see the installer log")+(f.fix?" "+f.fix:"")+" Log: CloudWatch /aws/codebuild/"+String(process.env.CODEBUILD_BUILD_ID||"").split(":")[0]).slice(0,4000);process.stdout.write(JSON.stringify({Status:ok?"SUCCESS":"FAILURE",Reason:why,UniqueId:"install",Data:ok?f.url:""}))' > /tmp/wait.json
                    curl --proto =https --proto-redir =https --tlsv1.2 -fsS -X PUT -H 'Content-Type:' --data-binary @/tmp/wait.json "$WAIT_URL"
                  fi

  StarterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ["coderhelm-${Stage}-starter-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
      PermissionsBoundary: !Ref Boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartInstaller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt InstallerProject.Arn
              # On delete or rollback: a window a failed build left behind (else the role can't be deleted).
              - Effect: Allow
                Action: iam:DeleteRolePolicy
                Resource: !GetAtt InstallerRole.Arn
              - Effect: Allow
                Action: [s3:PutBucketPolicy, s3:PutObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::coderhelm-setup-*
                  - !Sub arn:${AWS::Partition}:s3:::coderhelm-setup-*/status.json

  StarterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ["coderhelm-${Stage}-starter-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
      Description: Opens the progress file to the install guide and starts the CoderHelm installer once, when this stack is created.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt StarterRole.Arn
      Code:
        ZipFile: |
          import json, time, urllib.request, boto3

          def respond(event, context, status, reason=""):
              """Tells CloudFormation the result. Written here, not imported:
              the cfnresponse helper isn't provided on every runtime, and a
              missing import left stacks waiting an hour for an answer."""
              body = json.dumps({
                  "Status": status,
                  "Reason": (reason or "See the log: " + context.log_stream_name)[:500],
                  "PhysicalResourceId": "installer",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"Content-Type": "", "Content-Length": str(len(body))})
              urllib.request.urlopen(req, timeout=30).read()

          def public_status(bucket, p):
              """Lets anyone read status.json (only that file). Account-wide
              Block Public Access may refuse it: the guide then asks for the
              URL from this stack's Outputs instead, and the install goes on."""
              s3 = boto3.client("s3")
              try:
                  s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps({
                      "Version": "2012-10-17",
                      "Statement": [{"Sid": "InstallGuideReadsProgress", "Effect": "Allow", "Principal": "*",
                                     "Action": "s3:GetObject", "Resource": f"arn:aws:s3:::{bucket}/status.json"}]}))
              except Exception as e:
                  print("progress file stays private:", e)
              s3.put_object(Bucket=bucket, Key="status.json", ContentType="application/json", CacheControl="no-store",
                            Body=json.dumps({"schema": 1, "phase": "starting", "message": "Starting the installer",
                                             "version": p["Version"], "stage": p["Stage"], "region": p["Region"],
                                             "updatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}))

          def close_window(role):
              """A window a failed build left on the installer role: removed, so
              deleting or rolling back this stack never stops at the role."""
              try:
                  boto3.client("iam").delete_role_policy(RoleName=role, PolicyName="deploy-window")
              except Exception as e:
                  print("no window to close:", e)

          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete" and event["ResourceProperties"].get("InstallerRole"):
                      close_window(event["ResourceProperties"]["InstallerRole"])
                  if event["RequestType"] == "Create":
                      p = event["ResourceProperties"]
                      if p.get("Bucket"):
                          try:
                              public_status(p["Bucket"], p)
                          except Exception as e:
                              print("progress file not written:", e)
                      boto3.client("codebuild").start_build(
                          projectName=p["Project"],
                          environmentVariablesOverride=[{"name": "WAIT_URL", "value": p["WaitUrl"], "type": "PLAINTEXT"}],
                      )
                  respond(event, context, "SUCCESS")
              except Exception as e:
                  print(e)
                  respond(event, context, "FAILED", str(e)[:200])

  # Gives one install build its deploy window: only a running build of this
  # stack's project, with exactly this template's buildspec, image and
  # variables, asking as itself. The window is the installer role's inline
  # policy "deploy-window", bound to that build's session (aws:userid) and
  # an end time 100 minutes on (the build's timeout is 90).
  WindowRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ["coderhelm-${Stage}-window-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
      PermissionsBoundary: !Ref Boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpenWindow
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:BatchGetBuilds
                Resource: !GetAtt InstallerProject.Arn
              - Effect: Allow
                Action: [iam:GetRole, iam:PutRolePolicy]
                Resource: !GetAtt InstallerRole.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub ["arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/coderhelm-${Stage}/launch-${Id}/window-policy/*", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]

  WindowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ["coderhelm-${Stage}-window-${Id}", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
      Description: Gives a verified CoderHelm install build its deploy window (docs/self-host/security.md).
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt WindowRole.Arn
      Environment:
        Variables:
          PROJECT: !Ref InstallerProject
          ROLE: !Ref InstallerRole
          IMAGE: aws/codebuild/standard:7.0
          PARAM: !Sub ["/coderhelm-${Stage}/launch-${Id}/window-policy", { Id: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]] }]
          PARTS: "2"
          # sha256 of the installer's BuildSpec, each line's trailing spaces and
          # the ends trimmed (infra/test/launch-stack.test.ts keeps it equal).
          BUILDSPEC_SHA256: "9db4a942bb8b7868af171761eaa4225157d67766d835dab18b56a536ed1bcd6e"
          VARIABLES: "VERSION,STAGE,ADMIN_EMAIL,EMAIL_FROM,EMAIL_TRANSPORT,HOSTNAME_ARG,HOSTED_ZONE,MODEL_PROVIDER,BEDROCK_PREFIX,SIGNUP_DOMAIN,REQUIRE_TWO_FACTOR,TELEMETRY,AUTO_UPDATE,UPDATE_WINDOW,UPDATE_TIMEZONE,STATUS_BUCKET,SETUP_TOKEN,WAIT_URL,ACCESS_ID,INSTALLER_ROLE,WINDOW_FUNCTION,ASSETS_BUCKET"
      Code:
        ZipFile: |
          import json, os, re, hashlib, datetime, boto3

          E = os.environ

          def norm(text):
              return "\n".join(line.rstrip() for line in (text or "").strip().splitlines())

          def problems(b, user_id, role_id):
              p = []
              if b.get("projectName") != E["PROJECT"]: p.append("it is not this stack's installer build")
              if b.get("buildStatus") != "IN_PROGRESS": p.append("it is not running")
              src = b.get("source") or {}
              if src.get("type") != "NO_SOURCE" or b.get("secondarySources"): p.append("its source was changed")
              if hashlib.sha256(norm(src.get("buildspec")).encode()).hexdigest() != E["BUILDSPEC_SHA256"]:
                  p.append("its buildspec is not this template's")
              env = b.get("environment") or {}
              if env.get("image") != E["IMAGE"] or env.get("privilegedMode"): p.append("its build image was changed")
              allowed = set(E["VARIABLES"].split(","))
              for v in env.get("environmentVariables") or []:
                  if v.get("name") not in allowed or v.get("type", "PLAINTEXT") != "PLAINTEXT":
                      p.append("it sets " + str(v.get("name")))
              if not str(b.get("serviceRole") or "").endswith(":role/" + E["ROLE"]): p.append("it runs as another role")
              if not re.match(r"^" + role_id + r":[\w+=,.@-]{2,64}$", user_id): p.append("the caller is not the installer's role")
              return p

          def handler(event, context):
              try:
                  iam = boto3.client("iam")
                  builds = boto3.client("codebuild").batch_get_builds(ids=[str(event.get("build_id"))]).get("builds") or []
                  role_id = iam.get_role(RoleName=E["ROLE"])["Role"]["RoleId"]
                  user_id = str(event.get("user_id") or "")
                  bad = problems(builds[0], user_id, role_id) if builds else ["the build was not found"]
                  if bad:
                      return {"ok": False, "error": "the deploy window was refused: " + "; ".join(bad)}
                  ssm = boto3.client("ssm")
                  statements = []
                  for i in range(1, int(E["PARTS"]) + 1):
                      statements += json.loads(ssm.get_parameter(Name=E["PARAM"] + "/" + str(i))["Parameter"]["Value"])
                  until = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=100)).strftime("%Y-%m-%dT%H:%M:%SZ")
                  doc = json.dumps({"Version": "2012-10-17", "Statement": statements})
                  doc = doc.replace("__CODERHELM_USER_ID__", user_id).replace("__CODERHELM_EXPIRES__", until)
                  iam.put_role_policy(RoleName=E["ROLE"], PolicyName="deploy-window", PolicyDocument=doc)
                  return {"ok": True, "until": until}
              except Exception as e:
                  # AWS's own words: the action and resource it refused.
                  return {"ok": False, "error": str(e)[:500]}

  InstallDoneHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  StartInstall:
    Type: Custom::StartInstaller
    DependsOn: [WindowFunction, DeployRole, AssetsBucket, WindowPolicy1, WindowPolicy2]
    Properties:
      ServiceToken: !GetAtt StarterFunction.Arn
      Project: !Ref InstallerProject
      InstallerRole: !Ref InstallerRole
      WaitUrl: !Ref InstallDoneHandle
      Bucket: !If [HasStatus, !Ref StatusBucket, ""]
      Version: !Ref Version
      Stage: !Ref Stage
      Region: !Ref AWS::Region

  InstallDone:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: StartInstall
    Properties:
      Handle: !Ref InstallDoneHandle
      Timeout: "5400"
      Count: 1

Outputs:
  CoderHelm:
    Description: Your CoderHelm (as {"install":"<url>"}). Sign up there with your email.
    Value: !GetAtt InstallDone.Data
  InstallGuide:
    Condition: HasStatus
    Description: Back to the install guide, which checks every step and walks you through GitHub and models.
    Value: !Sub "https://docs.coderhelm.com/self-host/install/?id=${StatusId}&region=${AWS::Region}&stage=${Stage}"
  GitHubAppWithoutTheGuide:
    Description: Create your GitHub App from a computer with a browser and AWS credentials for this account.
    Value: !Sub "npx -y github:CoderHelm/coderhelm-platform pull --stage ${Stage} --region ${AWS::Region} && npx -y github:CoderHelm/coderhelm-platform github-app"
  Domain:
    Condition: HasHostname
    Description: The hostname CoderHelm answers on.
    Value: !Sub "https://${Hostname}"
  InstallerLogs:
    Description: The installer's log (kept after this stack is deleted).
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Faws$252Fcodebuild$252F${AWS::StackName}-installer"
