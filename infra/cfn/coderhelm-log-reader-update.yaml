AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Brings the existing CoderHelmLogReader role up to date with the read-only
  permissions the current CoderHelm release uses, lets it search the
  Bedrock knowledge bases named in KnowledgeBases, and lets it read the
  documents in the S3 buckets named in ImportBuckets. Every permission is
  read-only (list, describe and query), except one you opt into: copying
  your chosen CoderHelm knowledge bases into the Bedrock knowledge bases
  named in SyncKnowledgeBases. With InfrastructureVulnerabilities "on" it
  also reads, read-only, which versions your EC2, EKS, RDS, ElastiCache and
  OpenSearch resources run, for matching against security advisories.
  It only adds: to drop a permission an older release granted, update the
  CoderHelmLogReader stack itself with the current role template.
  Created from the dashboard's Update link; you can delete older
  CoderHelmLogReaderUpdate stacks once this one is in place.

Parameters:
  RoleName:
    Type: String
    Default: CoderHelmLogReader
    Description: The CoderHelm role to update (do not change this value).
    AllowedPattern: "^CoderHelmLogReader$"

  KnowledgeBases:
    Type: String
    Default: ""
    Description: >
      Bedrock knowledge bases CoderHelm may search, read-only: their ARNs
      separated by commas, or "all" for every knowledge base in this account.
      Empty: none (the role reads no knowledge base).
    AllowedPattern: "^(|all|arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10}(,arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10})*)$"
    ConstraintDescription: Knowledge base ARNs separated by commas, "all", or empty.

  ImportBuckets:
    Type: String
    Default: ""
    Description: >
      S3 buckets CoderHelm may import knowledge base documents from,
      read-only: their names separated by commas. Empty: none (the role reads
      no object in any bucket).
    AllowedPattern: "^(|[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](,[a-z0-9][a-z0-9.-]{1,61}[a-z0-9])*)$"
    ConstraintDescription: Bucket names separated by commas, or empty.

  SyncKnowledgeBases:
    Type: String
    Default: ""
    Description: >
      Bedrock knowledge bases CoderHelm may copy your chosen CoderHelm
      knowledge bases into: their ARNs separated by commas, or "all" for every
      knowledge base in this account. CoderHelm adds, updates and removes only
      the documents it copied there, and starts syncs of their data sources.
      Empty: none (the role writes to no knowledge base).
    AllowedPattern: "^(|all|arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10}(,arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10})*)$"
    ConstraintDescription: Knowledge base ARNs separated by commas, "all", or empty.

  InfrastructureVulnerabilities:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm read, read-only, what runs in this account so it can
      match it against security advisories: EC2 instances and their AMIs,
      Auto Scaling groups and the load balancers in front of them, EKS
      clusters and node groups, RDS and Aurora pending maintenance,
      ElastiCache service updates, OpenSearch software updates, ECR scan
      results, kernels from SSM inventory and AWS's public AMI parameters.
      Never Lambda function settings, launch template user data or
      environment variables.

Conditions:
  ReadsKnowledgeBases: !Not [!Equals [!Ref KnowledgeBases, ""]]
  ReadsEveryKnowledgeBase: !Equals [!Ref KnowledgeBases, "all"]
  ReadsImportBuckets: !Not [!Equals [!Ref ImportBuckets, ""]]
  SyncsKnowledgeBases: !Not [!Equals [!Ref SyncKnowledgeBases, ""]]
  SyncsEveryKnowledgeBase: !Equals [!Ref SyncKnowledgeBases, "all"]
  ReadsInfrastructure: !Equals [!Ref InfrastructureVulnerabilities, "on"]

Resources:
  CoderHelmReadOnlyUpdate:
    Type: AWS::IAM::Policy
    Properties:
      # One policy per update stack, so a newer update never collides with
      # an older one.
      PolicyName: !Ref AWS::StackName
      Roles:
        - !Ref RoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LogsAndAlarms
            Effect: Allow
            Action:
              - "logs:DescribeLogGroups"
              - "logs:FilterLogEvents"
              - "logs:GetLogEvents"
              - "logs:StartQuery"
              - "logs:GetQueryResults"
              - "logs:StopQuery"
              - "cloudwatch:DescribeAlarms"
              - "sts:GetCallerIdentity"
            Resource: "*"
          - Sid: CheckOwnPermissions
            Effect: Allow
            Action:
              - "iam:SimulatePrincipalPolicy"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${RoleName}"
          - Sid: CheckOwnUpdateStack
            Effect: Allow
            Action:
              - "cloudformation:DescribeStacks"
            Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/CoderHelmLogReaderUpdate-*/*"
          - Sid: ReadMetrics
            Effect: Allow
            Action:
              - "cloudwatch:GetMetricData"
              - "cloudwatch:ListMetrics"
            Resource: "*"
          - Sid: ListAirflowEnvironments
            Effect: Allow
            Action:
              - "airflow:ListEnvironments"
              - "airflow:GetEnvironment"
            Resource: "*"
          - Sid: ReadAirflowAsViewer
            Effect: Allow
            Action:
              - "airflow:InvokeRestApi"
            Resource: "arn:aws:airflow:*:*:role/*/Viewer"
          # A task definition as ECS returns it includes its containers'
          # environment variables; CoderHelm keeps only the log
          # configuration, start command, image, labels, storage, cpu and
          # memory from it, and never stores or shows the environment.
          - Sid: DescribeServicesAndTasks
            Effect: Allow
            Action:
              - "ecs:ListClusters"
              - "ecs:ListServices"
              - "ecs:DescribeServices"
              - "ecs:DescribeTaskDefinition"
              - "ecs:ListTasks"
              - "ecs:DescribeTasks"
            Resource: "*"
          # Tags, a stack's resource list and image manifests only: no
          # function configuration or code, no stack parameters.
          - Sid: FindTheCodeBehindALogGroup
            Effect: Allow
            Action:
              - "lambda:ListTags"
              - "logs:ListTagsForResource"
              - "cloudformation:ListStackResources"
              - "ecr:BatchGetImage"
              - "ecr:ListTagsForResource"
            Resource: "*"
          # Settings only, so a review can check a fact instead of asking: a
          # bucket's default encryption, its bucket policy and whether that
          # policy makes it public; a KMS key's description and key policy.
          # Never an object in a bucket, never an encrypt or decrypt call.
          - Sid: ReadBucketAndKeySettings
            Effect: Allow
            Action:
              - "s3:GetEncryptionConfiguration"
              - "s3:GetBucketPolicy"
              - "s3:GetBucketPolicyStatus"
              - "kms:DescribeKey"
              - "kms:GetKeyPolicy"
            Resource: "*"
          # Bedrock knowledge bases connected in place: searched live in
          # this account, nothing copied. Only the knowledge bases named in
          # KnowledgeBases (or every one in this account with "all"):
          # search and read a cited document, never change one.
          - !If
            - ReadsKnowledgeBases
            - Sid: ReadKnowledgeBases
              Effect: Allow
              Action:
                - "bedrock:Retrieve"
                - "bedrock:GetDocumentContent"
                - "bedrock:GetKnowledgeBase"
                - "bedrock:ListDataSources"
                - "bedrock:GetDataSource"
              Resource: !If
                - ReadsEveryKnowledgeBase
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:knowledge-base/*"
                - !Split [",", !Ref KnowledgeBases]
            - !Ref AWS::NoValue
          - !If
            - ReadsEveryKnowledgeBase
            - Sid: ListKnowledgeBases
              Effect: Allow
              Action:
                - "bedrock:ListKnowledgeBases"
              Resource: "*"
            - !Ref AWS::NoValue
          # Imports: the documents in the buckets named in ImportBuckets,
          # read so a knowledge base can index them; never a write, never
          # another bucket.
          - !If
            - ReadsImportBuckets
            - Sid: ReadImportBuckets
              Effect: Allow
              Action:
                - "s3:ListBucket"
                - "s3:GetBucketLocation"
              Resource: !Split
                - ","
                - !Sub
                  - "arn:aws:s3:::${Names}"
                  - Names: !Join [",arn:aws:s3:::", !Split [",", !Ref ImportBuckets]]
            - !Ref AWS::NoValue
          - !If
            - ReadsImportBuckets
            - Sid: ReadImportObjects
              Effect: Allow
              Action:
                - "s3:GetObject"
              Resource: !Split
                - ","
                - !Sub
                  - "arn:aws:s3:::${Names}/*"
                  - Names: !Join ["/*,arn:aws:s3:::", !Split [",", !Ref ImportBuckets]]
            - !Ref AWS::NoValue
          # A bucket encrypted with its own KMS key: decrypt only through S3,
          # so only objects the role may read anyway.
          - !If
            - ReadsImportBuckets
            - Sid: DecryptImportsThroughS3
              Effect: Allow
              Action:
                - "kms:Decrypt"
              Resource: "*"
              Condition:
                StringLike:
                  kms:ViaService: "s3.*.amazonaws.com"
            - !Ref AWS::NoValue
          # Copying knowledge into Bedrock: only into the knowledge bases named in
          # SyncKnowledgeBases (or every one in this account with "all"). Adds,
          # updates and removes documents of a custom data source, and starts a
          # sync of an S3 data source; nothing else in a knowledge base changes.
          - !If
            - SyncsKnowledgeBases
            - Sid: SyncKnowledgeBases
              Effect: Allow
              Action:
                - "bedrock:IngestKnowledgeBaseDocuments"
                - "bedrock:DeleteKnowledgeBaseDocuments"
                - "bedrock:GetKnowledgeBaseDocuments"
                - "bedrock:ListKnowledgeBaseDocuments"
                - "bedrock:StartIngestionJob"
                - "bedrock:GetIngestionJob"
                - "bedrock:GetKnowledgeBase"
                - "bedrock:GetDataSource"
              Resource: !If
                - SyncsEveryKnowledgeBase
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:knowledge-base/*"
                - !Split [",", !Ref SyncKnowledgeBases]
            - !Ref AWS::NoValue
          # Infrastructure vulnerabilities, only when InfrastructureVulnerabilities
          # is "on": describe and list calls that say which versions run (AMIs,
          # node group releases, engine versions), whether a resource is reachable
          # from the internet, and what AWS has pending for it. Nothing here
          # returns user data, environment variables or secrets, and nothing is
          # changed: CoderHelm opens pull requests in your code and shows the AWS
          # steps for a person to run.
          - !If
            - ReadsInfrastructure
            - Sid: ReadInfrastructureVersions
              Effect: Allow
              Action:
                - "ec2:DescribeInstances"
                - "ec2:DescribeImages"
                - "autoscaling:DescribeAutoScalingGroups"
                - "elasticloadbalancing:DescribeTargetGroups"
                - "elasticloadbalancing:DescribeLoadBalancers"
                - "eks:ListClusters"
                - "eks:DescribeCluster"
                - "eks:ListNodegroups"
                - "eks:DescribeNodegroup"
                - "rds:DescribeDBClusters"
                - "rds:DescribeDBInstances"
                - "rds:DescribePendingMaintenanceActions"
                - "elasticache:DescribeServiceUpdates"
                - "elasticache:DescribeUpdateActions"
                - "es:ListDomainNames"
                - "es:DescribeDomains"
                - "ecr:DescribeImageScanFindings"
                - "ssm:ListInventoryEntries"
              Resource: "*"
            - !Ref AWS::NoValue
          # AWS's public "latest AMI" parameters only (the AMI a fix points to).
          - !If
            - ReadsInfrastructure
            - Sid: ReadPublicAmiParameters
              Effect: Allow
              Action:
                - "ssm:GetParameters"
              Resource: "arn:aws:ssm:*::parameter/aws/service/*"
            - !Ref AWS::NoValue
