AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a read-only IAM role that allows Coderhelm to query your CloudWatch Logs and metrics,
  read Airflow (MWAA) as a Viewer, and search the Bedrock knowledge bases you name.
  Only when you name them in SyncKnowledgeBases, it may also copy your chosen Coderhelm
  knowledge bases into those Bedrock knowledge bases. With
  InfrastructureVulnerabilities "on" it also reads, read-only, which versions
  your EC2, EKS, RDS, ElastiCache and OpenSearch resources run. With
  ApplyMaintenance "on" it may also apply a pending RDS or Aurora
  maintenance action that a person approved in CoderHelm. With WafLogs "on"
  it reads your AWS WAF logs in S3 through Athena, writing query results
  only under WafLogResults. With DatabaseClusters or Warehouses it queries
  those databases and warehouses as their read-only user. Every read is
  declared here, by group; a CoderHelm release reaches this role only
  through an update you create from its template.
  This role uses an External ID to prevent confused deputy attacks.

Parameters:
  ExternalId:
    Type: String
    Description: The External ID provided by Coderhelm (do not change this value).
    MinLength: 1
    AllowedPattern: "^[a-f0-9\\-]{36}$"
    ConstraintDescription: Must be a valid UUID.

  CoderHelmAccountId:
    Type: String
    Default: "654654210434"
    Description: The AWS account ID of Coderhelm, or of your self-hosted install (do not change this value).
    AllowedPattern: "^\\d{12}$"

  TrustedRolePrefix:
    Type: String
    Default: ""
    Description: >
      Only roles whose names start with this may take on the role (a self-hosted
      install's resource prefix and a dash, such as coderhelm-prod-). Empty
      allows any role in that account (do not change this value).
    AllowedPattern: "^[A-Za-z0-9_-]{0,41}$"

  KnowledgeBases:
    Type: String
    Default: ""
    Description: >
      Bedrock knowledge bases CoderHelm may search, read-only: their ARNs
      separated by commas, or "all" for every knowledge base in this account.
      Empty: none (the role reads no knowledge base).
    AllowedPattern: "^(|all|arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10}(,arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10})*)$"
    ConstraintDescription: Knowledge base ARNs separated by commas, "all", or empty.

  ImportBuckets:
    Type: String
    Default: ""
    Description: >
      S3 buckets CoderHelm may import knowledge base documents from,
      read-only: their names separated by commas. Empty: none (the role reads
      no object in any bucket).
    AllowedPattern: "^(|[a-z0-9][a-z0-9.-]{1,61}[a-z0-9](,[a-z0-9][a-z0-9.-]{1,61}[a-z0-9])*)$"
    ConstraintDescription: Bucket names separated by commas, or empty.

  SyncKnowledgeBases:
    Type: String
    Default: ""
    Description: >
      Bedrock knowledge bases CoderHelm may copy your chosen CoderHelm
      knowledge bases into: their ARNs separated by commas, or "all" for every
      knowledge base in this account. CoderHelm adds, updates and removes only
      the documents it copied there, and starts syncs of their data sources.
      Empty: none (the role writes to no knowledge base).
    AllowedPattern: "^(|all|arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10}(,arn:aws:bedrock:[a-z0-9-]+:[0-9]{12}:knowledge-base/[A-Z0-9]{10})*)$"
    ConstraintDescription: Knowledge base ARNs separated by commas, "all", or empty.

  InfrastructureVulnerabilities:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm read, read-only, what runs in this account so it can
      match it against security advisories: EC2 instances and their AMIs,
      Auto Scaling groups and the load balancers in front of them, EKS
      clusters and node groups, RDS and Aurora pending maintenance,
      ElastiCache service updates, OpenSearch software updates, ECR scan
      results, kernels from SSM inventory and AWS's public AMI parameters.
      Never Lambda function settings, launch template user data or
      environment variables.

  InspectorFindings:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm read Amazon Inspector's findings in this account
      (read-only), when you run Inspector. Inspector is billed by AWS, about
      $1.25 per instance a month, $0.09 per image scan and $0.30 per
      function a month; CoderHelm never turns it on.

  HealthEvents:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm read this account's AWS Health events through the
      Health API (read-only), which needs AWS Business Support or higher.

  ApplyMaintenance:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm apply a pending RDS or Aurora maintenance action
      (an operating system update, an engine patch or upgrade, a serverless
      platform update) that a person approved in CoderHelm, through AWS's
      own ApplyPendingMaintenanceAction, only on this account's database
      clusters and instances. Nothing is applied without that approval.

  WafLogs:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" lets CoderHelm read what an AWS WAF web ACL logs to S3 (the
      aws-waf-logs-* buckets, the names AWS requires) when a WAF alarm on
      one of your alert routes fires: the log objects, the Glue table
      definitions Athena needs, and your Athena workgroups' settings. With
      WafLogResults set it also runs read-only Athena queries over those
      logs, writing their results only under that location. Every change to
      WAF, Athena, Glue or a bucket is denied.

  WafLogResults:
    Type: String
    Default: ""
    Description: >
      Where the Athena workgroup that queries your WAF logs writes query
      results: its "Query result location" without s3:// (bucket/prefix/).
      CoderHelm fills it in from the workgroup when it can. Empty: no Athena
      query and nothing written anywhere.
    AllowedPattern: "^(|[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9!_.'()=/-]*)$"
    ConstraintDescription: A bucket name, a slash and a prefix (bucket/prefix/), or empty.

  WafLogKey:
    Type: String
    Default: ""
    Description: >
      The ARN of the customer-managed KMS key the WAF log bucket is
      encrypted with, if it is. CoderHelm fills it in from the bucket's
      default encryption. The role may decrypt with it only through S3, so
      only objects it may read anyway. Empty: none (SSE-S3 needs nothing).
    AllowedPattern: "^(|arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36})$"
    ConstraintDescription: A KMS key ARN, or empty.

  DatabaseClusters:
    Type: String
    Default: ""
    Description: >
      Aurora PostgreSQL clusters CoderHelm may query as the read-only
      database user coderhelm_readonly (their ARNs separated by commas),
      through the RDS Data API inside transactions that are always rolled
      back. The user and its password secret (coderhelm-readonly-*) are made
      by the data source setup on Settings, Data sources, AWS. Empty: none.
    AllowedPattern: "^(|arn:aws:rds:[a-z0-9-]+:[0-9]{12}:cluster:[a-z][a-z0-9-]{0,62}(,arn:aws:rds:[a-z0-9-]+:[0-9]{12}:cluster:[a-z][a-z0-9-]{0,62})*)$"
    ConstraintDescription: Aurora cluster ARNs separated by commas, or empty.

  Warehouses:
    Type: String
    Default: ""
    Description: >
      Redshift clusters CoderHelm may query, signed in only as the
      passwordless read-only user coderhelm_readonly (their names separated
      by commas). Empty: none.
    AllowedPattern: "^(|[a-z][a-z0-9-]{0,62}(,[a-z][a-z0-9-]{0,62})*)$"
    ConstraintDescription: Redshift cluster names separated by commas, or empty.

Conditions:
  ReadsKnowledgeBases: !Not [!Equals [!Ref KnowledgeBases, ""]]
  ReadsEveryKnowledgeBase: !Equals [!Ref KnowledgeBases, "all"]
  ReadsImportBuckets: !Not [!Equals [!Ref ImportBuckets, ""]]
  SyncsKnowledgeBases: !Not [!Equals [!Ref SyncKnowledgeBases, ""]]
  SyncsEveryKnowledgeBase: !Equals [!Ref SyncKnowledgeBases, "all"]
  ReadsInfrastructure: !Equals [!Ref InfrastructureVulnerabilities, "on"]
  ReadsInspector: !Equals [!Ref InspectorFindings, "on"]
  ReadsHealth: !Equals [!Ref HealthEvents, "on"]
  AppliesMaintenance: !Equals [!Ref ApplyMaintenance, "on"]
  ReadsWafLogs: !Equals [!Ref WafLogs, "on"]
  QueriesWafLogs: !And [!Condition ReadsWafLogs, !Not [!Equals [!Ref WafLogResults, ""]]]
  NoWafLogQueries: !And [!Condition ReadsWafLogs, !Equals [!Ref WafLogResults, ""]]
  DecryptsWafLogs: !And [!Condition ReadsWafLogs, !Not [!Equals [!Ref WafLogKey, ""]]]
  ReadsDatabases: !Not [!Equals [!Ref DatabaseClusters, ""]]
  ReadsWarehouses: !Not [!Equals [!Ref Warehouses, ""]]

Resources:
  CoderHelmLogReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CoderHelmLogReader
      Description: >
        Read-only role for Coderhelm to query CloudWatch Logs.
        No data is stored - only error summaries are returned to Coderhelm.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CoderHelmAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
              # Only CoderHelm's own roles in that account, not its people
              # or other workloads (a self-hosted install's account is often
              # shared).
              ArnLike:
                "aws:PrincipalArn": !Sub "arn:aws:iam::${CoderHelmAccountId}:role/${TrustedRolePrefix}*"
      Policies:
        - PolicyName: CloudWatchLogsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLogGroups
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                Resource: "*"
              - Sid: QueryLogs
                Effect: Allow
                Action:
                  - "logs:StartQuery"
                  - "logs:GetQueryResults"
                  - "logs:StopQuery"
                  - "logs:FilterLogEvents"
                  - "logs:GetLogEvents"
                Resource: "arn:aws:logs:*:*:log-group:*"
              - Sid: ReadAlarms
                Effect: Allow
                Action:
                  - "cloudwatch:DescribeAlarms"
                Resource: "*"
              - Sid: VerifyIdentity
                Effect: Allow
                Action:
                  - "sts:GetCallerIdentity"
                Resource: "*"
              # Lets CoderHelm check which of these permissions the role
              # has (IAM's policy simulator, on this role only), so the
              # dashboard can say when a release needs a new one.
              - Sid: CheckOwnPermissions
                Effect: Allow
                Action:
                  - "iam:SimulatePrincipalPolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/CoderHelmLogReader"
              # Whether the dashboard's Update link was used: the status of
              # CoderHelm's own update stacks only, no other stack.
              - Sid: CheckOwnUpdateStack
                Effect: Allow
                Action:
                  - "cloudformation:DescribeStacks"
                Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/CoderHelmLogReaderUpdate-*/*"
              # Before a fix for a log error is written: which tasks of the
              # service behind a log group are running, since when, and how
              # they start. Lists and describes only. A task definition as
              # ECS returns it includes its containers' environment
              # variables; CoderHelm keeps only the log configuration, start
              # command, image, labels, storage, cpu and memory from it, and
              # never stores or shows the environment.
              - Sid: DescribeTasksBehindLogErrors
                Effect: Allow
                Action:
                  - "ecs:ListClusters"
                  - "ecs:ListServices"
                  - "ecs:DescribeServices"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:ListTasks"
                  - "ecs:DescribeTasks"
                Resource: "*"
        - PolicyName: CloudWatchMetricsAndAirflowReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMetrics
                Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:ListMetrics"
                Resource: "*"
              - Sid: ListAirflowEnvironments
                Effect: Allow
                Action:
                  - "airflow:ListEnvironments"
                  - "airflow:GetEnvironment"
                Resource: "*"
              - Sid: ReadAirflowAsViewer
                Effect: Allow
                Action:
                  - "airflow:InvokeRestApi"
                Resource: "arn:aws:airflow:*:*:role/*/Viewer"
        - PolicyName: FindTheCodeBehindALogGroupReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Which service writes a log group, so a fix goes to the repo its
              # code lives in: tags, a stack's resource list (names and types)
              # and image manifests only. No function configuration (it holds
              # environment variables), no function code, no stack
              # parameters, no image layers; nothing is changed.
              - Sid: DescribeServicesBehindLogGroups
                Effect: Allow
                Action:
                  - "ecs:ListClusters"
                  - "ecs:ListServices"
                  - "ecs:DescribeServices"
                  - "lambda:ListTags"
                  - "logs:ListTagsForResource"
                  - "cloudformation:ListStackResources"
                  - "ecr:BatchGetImage"
                  - "ecr:ListTagsForResource"
                Resource: "*"
        - PolicyName: FirewallRequestsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # When an AWS WAF alarm fires: which web ACL it watches, the
              # requests its rule matched (WAF's sampled requests) and where
              # the web ACL logs, so a fix to the rule is based on what
              # clients sent. CoderHelm keeps only user agents, header names,
              # paths and countries from them; never client addresses,
              # cookies or other header values. Nothing is changed.
              - Sid: ReadFirewallRequests
                Effect: Allow
                Action:
                  - "wafv2:ListWebACLs"
                  - "wafv2:GetSampledRequests"
                  - "wafv2:GetLoggingConfiguration"
                Resource: "*"
              # The CloudFront distributions in front of a web ACL: their
              # domains, origins and where they log. Nothing is changed.
              - Sid: ReadCloudFrontDistributions
                Effect: Allow
                Action:
                  - "cloudfront:ListDistributions"
                  - "cloudfront:GetDistribution"
                Resource: "*"
        - PolicyName: BucketAndKeySettingsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Settings only, so a review can check a fact instead of asking:
              # a bucket's default encryption, its bucket policy and whether
              # that policy makes it public; a KMS key's description and key
              # policy. Never an object in a bucket, never an encrypt or
              # decrypt call.
              - Sid: ReadBucketAndKeySettings
                Effect: Allow
                Action:
                  - "s3:GetEncryptionConfiguration"
                  - "s3:GetBucketPolicy"
                  - "s3:GetBucketPolicyStatus"
                  - "kms:DescribeKey"
                  - "kms:GetKeyPolicy"
                Resource: "*"
        # Bedrock knowledge bases connected in place: searched live in this
        # account, nothing copied. Only the knowledge bases named in
        # KnowledgeBases (or every one in this account with "all"): search
        # and read a cited document, never change one.
        - !If
          - ReadsKnowledgeBases
          - PolicyName: KnowledgeBasesReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadKnowledgeBases
                  Effect: Allow
                  Action:
                    - "bedrock:Retrieve"
                    - "bedrock:GetDocumentContent"
                    - "bedrock:GetKnowledgeBase"
                    - "bedrock:ListDataSources"
                    - "bedrock:GetDataSource"
                  Resource: !If
                    - ReadsEveryKnowledgeBase
                    - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:knowledge-base/*"
                    - !Split [",", !Ref KnowledgeBases]
                - !If
                  - ReadsEveryKnowledgeBase
                  - Sid: ListKnowledgeBases
                    Effect: Allow
                    Action:
                      - "bedrock:ListKnowledgeBases"
                    Resource: "*"
                  - !Ref AWS::NoValue
          - !Ref AWS::NoValue
        # Imports: the documents in the buckets named in ImportBuckets, read
        # so a knowledge base can index them; never a write, never another
        # bucket.
        - !If
          - ReadsImportBuckets
          - PolicyName: KnowledgeImportsReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadImportBuckets
                  Effect: Allow
                  Action:
                    - "s3:ListBucket"
                    - "s3:GetBucketLocation"
                  Resource: !Split
                    - ","
                    - !Sub
                      - "arn:aws:s3:::${Names}"
                      - Names: !Join [",arn:aws:s3:::", !Split [",", !Ref ImportBuckets]]
                - Sid: ReadImportObjects
                  Effect: Allow
                  Action:
                    - "s3:GetObject"
                  Resource: !Split
                    - ","
                    - !Sub
                      - "arn:aws:s3:::${Names}/*"
                      - Names: !Join ["/*,arn:aws:s3:::", !Split [",", !Ref ImportBuckets]]
                # A bucket encrypted with its own KMS key: decrypt only through S3,
                # so only objects the role may read anyway.
                - Sid: DecryptImportsThroughS3
                  Effect: Allow
                  Action:
                    - "kms:Decrypt"
                  Resource: "*"
                  Condition:
                    StringLike:
                      kms:ViaService: "s3.*.amazonaws.com"
          - !Ref AWS::NoValue
        # Copying knowledge into Bedrock: only into the knowledge bases named
        # in SyncKnowledgeBases (or every one in this account with "all").
        # Adds, updates and removes documents of a custom data source, and
        # starts a sync of an S3 data source; nothing else changes.
        - !If
          - SyncsKnowledgeBases
          - PolicyName: KnowledgeBaseSync
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: SyncKnowledgeBases
                  Effect: Allow
                  Action:
                    - "bedrock:IngestKnowledgeBaseDocuments"
                    - "bedrock:DeleteKnowledgeBaseDocuments"
                    - "bedrock:GetKnowledgeBaseDocuments"
                    - "bedrock:ListKnowledgeBaseDocuments"
                    - "bedrock:StartIngestionJob"
                    - "bedrock:GetIngestionJob"
                    - "bedrock:GetKnowledgeBase"
                    - "bedrock:GetDataSource"
                  Resource: !If
                    - SyncsEveryKnowledgeBase
                    - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:knowledge-base/*"
                    - !Split [",", !Ref SyncKnowledgeBases]
          - !Ref AWS::NoValue
        # Infrastructure vulnerabilities, only when InfrastructureVulnerabilities
        # is "on": describe and list calls that say which versions run, whether a
        # resource is reachable from the internet, and what AWS has pending for
        # it. Never user data, environment variables or secrets; nothing changes.
        - !If
          - ReadsInfrastructure
          - PolicyName: InfrastructureVersionsReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadInfrastructureVersions
                  Effect: Allow
                  Action:
                    - "ec2:DescribeInstances"
                    - "ec2:DescribeImages"
                    - "autoscaling:DescribeAutoScalingGroups"
                    - "elasticloadbalancing:DescribeTargetGroups"
                    - "elasticloadbalancing:DescribeLoadBalancers"
                    - "eks:ListClusters"
                    - "eks:DescribeCluster"
                    - "eks:ListNodegroups"
                    - "eks:DescribeNodegroup"
                    - "rds:DescribeDBClusters"
                    - "rds:DescribeDBInstances"
                    - "rds:DescribePendingMaintenanceActions"
                    - "elasticache:DescribeServiceUpdates"
                    - "elasticache:DescribeUpdateActions"
                    - "es:ListDomainNames"
                    - "es:DescribeDomains"
                    - "ecr:DescribeImageScanFindings"
                    # Which stack made a resource (its name and the resource's
                    # logical id), where CloudFormation does not tag the resource:
                    # never a template, parameters or outputs.
                    - "cloudformation:DescribeStackResources"
                    - "ssm:ListInventoryEntries"
                  Resource: "*"
                # AWS's public "latest AMI" parameters only.
                - Sid: ReadPublicAmiParameters
                  Effect: Allow
                  Action:
                    - "ssm:GetParameters"
                  Resource: "arn:aws:ssm:*::parameter/aws/service/*"
          - !Ref AWS::NoValue
        # Amazon Inspector's findings and AWS Health events, each only when
        # its parameter is "on". Read-only.
        - !If
          - ReadsInspector
          - PolicyName: InspectorFindingsReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadInspectorFindings
                  Effect: Allow
                  Action:
                    - "inspector2:ListFindings"
                    - "inspector2:ListCoverage"
                    - "inspector2:BatchGetAccountStatus"
                  Resource: "*"
          - !Ref AWS::NoValue
        # Applying a pending RDS or Aurora maintenance action, only when
        # ApplyMaintenance is "on", and only after a person approved that
        # action in CoderHelm. Only this account's clusters and instances.
        - !If
          - AppliesMaintenance
          - PolicyName: ApplyApprovedMaintenance
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ApplyApprovedMaintenance
                  Effect: Allow
                  Action:
                    - "rds:ApplyPendingMaintenanceAction"
                  Resource:
                    - !Sub "arn:aws:rds:*:${AWS::AccountId}:cluster:*"
                    - !Sub "arn:aws:rds:*:${AWS::AccountId}:db:*"
          - !Ref AWS::NoValue
        - !If
          - ReadsHealth
          - PolicyName: HealthEventsReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadHealthEvents
                  Effect: Allow
                  Action:
                    - "health:DescribeEvents"
                    - "health:DescribeAffectedEntities"
                    - "health:DescribeEventDetails"
                  Resource: "*"
          - !Ref AWS::NoValue

        # AWS WAF logs in S3, only when WafLogs is "on" (an alert route takes
        # WAF alarms): the log objects, the table definitions and workgroup
        # settings Athena needs, and, with WafLogResults, read-only queries whose
        # results are written only there (the role's one write, held there by a
        # deny). Everything that changes WAF, Athena, Glue or a bucket is denied.
        - !If
          - ReadsWafLogs
          - PolicyName: WafLogsReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadWafLogObjects
                  Effect: Allow
                  Action:
                    - "s3:GetObject"
                  Resource: "arn:aws:s3:::aws-waf-logs-*/*"
                - Sid: ListWafLogBuckets
                  Effect: Allow
                  Action:
                    - "s3:ListBucket"
                    - "s3:GetBucketLocation"
                  Resource: "arn:aws:s3:::aws-waf-logs-*"
                # Table definitions only (names, columns, where the data is): Athena
                # reads them to plan a query. The data itself is readable only in the
                # aws-waf-logs-* buckets above.
                - Sid: FindWafLogTables
                  Effect: Allow
                  Action:
                    - "glue:GetDatabases"
                    - "glue:GetDatabase"
                    - "glue:GetTables"
                    - "glue:GetTable"
                    - "glue:GetPartitions"
                  Resource:
                    - !Sub "arn:aws:glue:*:${AWS::AccountId}:catalog"
                    - !Sub "arn:aws:glue:*:${AWS::AccountId}:database/*"
                    - !Sub "arn:aws:glue:*:${AWS::AccountId}:table/*/*"
                # Which workgroup queries the logs and where it writes its results.
                - Sid: FindWafLogWorkgroups
                  Effect: Allow
                  Action:
                    - "athena:ListWorkGroups"
                    - "athena:GetWorkGroup"
                  Resource: "*"
                - !If
                  - QueriesWafLogs
                  - Sid: QueryWafLogs
                    Effect: Allow
                    Action:
                      - "athena:StartQueryExecution"
                      - "athena:GetQueryExecution"
                      - "athena:GetQueryResults"
                      - "athena:StopQueryExecution"
                    Resource: !Sub "arn:aws:athena:*:${AWS::AccountId}:workgroup/*"
                  - !Ref AWS::NoValue
                - !If
                  - QueriesWafLogs
                  - Sid: WriteQueryResultsOnly
                    Effect: Allow
                    Action:
                      - "s3:PutObject"
                      - "s3:GetObject"
                    Resource: !Sub "arn:aws:s3:::${WafLogResults}*"
                  - !Ref AWS::NoValue
                - !If
                  - QueriesWafLogs
                  - Sid: FindQueryResults
                    Effect: Allow
                    Action:
                      - "s3:ListBucket"
                      - "s3:GetBucketLocation"
                    Resource: !Sub
                      - "arn:aws:s3:::${Bucket}"
                      - Bucket: !Select [0, !Split ["/", !Ref WafLogResults]]
                  - !Ref AWS::NoValue
                - !If
                  - QueriesWafLogs
                  - Sid: NoWritesButQueryResults
                    Effect: Deny
                    Action: ["s3:PutObject"]
                    NotResource: !Sub "arn:aws:s3:::${WafLogResults}*"
                  - !Ref AWS::NoValue
                - !If
                  - NoWafLogQueries
                  - Sid: NoWrites
                    Effect: Deny
                    Action: ["s3:PutObject"]
                    Resource: "*"
                  - !Ref AWS::NoValue
                - !If
                  - DecryptsWafLogs
                  - Sid: DecryptWafLogsThroughS3
                    Effect: Allow
                    Action:
                      - "kms:Decrypt"
                    Resource: !Ref WafLogKey
                    Condition:
                      StringLike:
                        kms:ViaService: "s3.*.amazonaws.com"
                  - !Ref AWS::NoValue
                - Sid: NeverChangeWafOrItsLogs
                  Effect: Deny
                  Action: ["wafv2:Create*", "wafv2:Update*", "wafv2:Delete*", "wafv2:Put*", "wafv2:Associate*", "wafv2:Disassociate*", "wafv2:Tag*", "wafv2:Untag*", "athena:Create*", "athena:Update*", "athena:Delete*", "athena:Put*", "athena:Import*", "athena:Tag*", "athena:Untag*", "glue:Create*", "glue:Update*", "glue:Delete*", "glue:Put*", "glue:BatchCreate*", "glue:BatchDelete*", "glue:BatchUpdate*", "glue:GetConnection*", "s3:Delete*", "s3:PutBucket*", "s3:PutObjectAcl*", "s3:PutObjectTagging*"]
                  Resource: "*"
          - !Ref AWS::NoValue
        # Databases, only those named in DatabaseClusters: queries as the
        # read-only database user inside transactions that are rolled back, never
        # committed; the only secret readable is that user's password.
        - !If
          - ReadsDatabases
          - PolicyName: DatabasesReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: QueryChosenDatabases
                  Effect: Allow
                  Action:
                    - "rds-data:BeginTransaction"
                    - "rds-data:ExecuteStatement"
                    - "rds-data:RollbackTransaction"
                  Resource: !Split [",", !Ref DatabaseClusters]
                - Sid: ReadOnlyUserPassword
                  Effect: Allow
                  Action:
                    - "secretsmanager:GetSecretValue"
                  Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:coderhelm-readonly-*"
                - Sid: NeverCommit
                  Effect: Deny
                  Action: ["rds-data:CommitTransaction", "rds-data:BatchExecuteStatement"]
                  Resource: "*"
          - !Ref AWS::NoValue
        # Warehouses, only those named in Warehouses: signed in only as the
        # passwordless read-only user, single statements, its own results.
        - !If
          - ReadsWarehouses
          - PolicyName: WarehousesReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: SignInAsTheReadOnlyUser
                  Effect: Allow
                  Action:
                    - "redshift:GetClusterCredentials"
                  Resource: !Split
                    - ","
                    - !Sub
                      - "arn:aws:redshift:*:*:dbuser:${Ids}/coderhelm_readonly"
                      - Ids: !Join ["/coderhelm_readonly,arn:aws:redshift:*:*:dbuser:", !Split [",", !Ref Warehouses]]
                - Sid: IntoTheirDatabases
                  Effect: Allow
                  Action:
                    - "redshift:GetClusterCredentials"
                  Resource: !Split
                    - ","
                    - !Sub
                      - "arn:aws:redshift:*:*:dbname:${Ids}/*"
                      - Ids: !Join ["/*,arn:aws:redshift:*:*:dbname:", !Split [",", !Ref Warehouses]]
                - Sid: RunOneStatement
                  Effect: Allow
                  Action:
                    - "redshift-data:ExecuteStatement"
                  Resource: !Split
                    - ","
                    - !Sub
                      - "arn:aws:redshift:*:*:cluster:${Ids}"
                      - Ids: !Join [",arn:aws:redshift:*:*:cluster:", !Split [",", !Ref Warehouses]]
                - Sid: ReadOwnResults
                  Effect: Allow
                  Action:
                    - "redshift-data:DescribeStatement"
                    - "redshift-data:GetStatementResult"
                    - "redshift-data:CancelStatement"
                  Resource: "*"
                  Condition:
                    StringEquals:
                      redshift-data:statement-owner-iam-userid: "${aws:userid}"
                - Sid: NothingElseInTheWarehouse
                  Effect: Deny
                  Action: ["redshift-data:BatchExecuteStatement", "redshift:CreateClusterUser", "redshift:GetClusterCredentialsWithIAM", "redshift:ModifyCluster*", "redshift:Delete*"]
                  Resource: "*"
          - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: >
      Copy this Role ARN and paste it into Coderhelm's AWS Connection settings.
    Value: !GetAtt CoderHelmLogReaderRole.Arn

  ExternalId:
    Description: The External ID used for this connection.
    Value: !Ref ExternalId
