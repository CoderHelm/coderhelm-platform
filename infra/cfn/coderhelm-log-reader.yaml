AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a read-only IAM role that allows Coderhelm to query your CloudWatch Logs and metrics
  and read Airflow (MWAA) as a Viewer.
  This role uses an External ID to prevent confused deputy attacks.

Parameters:
  ExternalId:
    Type: String
    Description: The External ID provided by Coderhelm (do not change this value).
    MinLength: 1
    AllowedPattern: "^[a-f0-9\\-]{36}$"
    ConstraintDescription: Must be a valid UUID.

  CoderHelmAccountId:
    Type: String
    Default: "654654210434"
    Description: The AWS account ID of Coderhelm, or of your self-hosted install (do not change this value).
    AllowedPattern: "^\\d{12}$"

  TrustedRolePrefix:
    Type: String
    Default: ""
    Description: >
      Only roles whose names start with this may take on the role (a self-hosted
      install's resource prefix and a dash, such as coderhelm-prod-). Empty
      allows any role in that account (do not change this value).
    AllowedPattern: "^[A-Za-z0-9_-]{0,41}$"

Resources:
  CoderHelmLogReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CoderHelmLogReader
      Description: >
        Read-only role for Coderhelm to query CloudWatch Logs.
        No data is stored - only error summaries are returned to Coderhelm.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${CoderHelmAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
              # Only CoderHelm's own roles in that account, not its people
              # or other workloads (a self-hosted install's account is often
              # shared).
              ArnLike:
                "aws:PrincipalArn": !Sub "arn:aws:iam::${CoderHelmAccountId}:role/${TrustedRolePrefix}*"
      Policies:
        - PolicyName: CloudWatchLogsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeLogGroups
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                Resource: "*"
              - Sid: QueryLogs
                Effect: Allow
                Action:
                  - "logs:StartQuery"
                  - "logs:GetQueryResults"
                  - "logs:StopQuery"
                  - "logs:FilterLogEvents"
                  - "logs:GetLogEvents"
                Resource: "arn:aws:logs:*:*:log-group:*"
              - Sid: ReadAlarms
                Effect: Allow
                Action:
                  - "cloudwatch:DescribeAlarms"
                Resource: "*"
              - Sid: VerifyIdentity
                Effect: Allow
                Action:
                  - "sts:GetCallerIdentity"
                Resource: "*"
              # Lets CoderHelm check which of these permissions the role
              # has (IAM's policy simulator, on this role only), so the
              # dashboard can say when a release needs a new one.
              - Sid: CheckOwnPermissions
                Effect: Allow
                Action:
                  - "iam:SimulatePrincipalPolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/CoderHelmLogReader"
              # Whether the dashboard's Update link was used: the status of
              # CoderHelm's own update stacks only, no other stack.
              - Sid: CheckOwnUpdateStack
                Effect: Allow
                Action:
                  - "cloudformation:DescribeStacks"
                Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/CoderHelmLogReaderUpdate-*/*"
              # Before a fix for a log error is written: which tasks of the
              # service behind a log group are running, since when, and how
              # they start. Lists and describes only. A task definition as
              # ECS returns it includes its containers' environment
              # variables; CoderHelm keeps only the log configuration, start
              # command, image, labels, storage, cpu and memory from it, and
              # never stores or shows the environment.
              - Sid: DescribeTasksBehindLogErrors
                Effect: Allow
                Action:
                  - "ecs:ListClusters"
                  - "ecs:ListServices"
                  - "ecs:DescribeServices"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:ListTasks"
                  - "ecs:DescribeTasks"
                Resource: "*"
        - PolicyName: CloudWatchMetricsAndAirflowReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMetrics
                Effect: Allow
                Action:
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:ListMetrics"
                Resource: "*"
              - Sid: ListAirflowEnvironments
                Effect: Allow
                Action:
                  - "airflow:ListEnvironments"
                  - "airflow:GetEnvironment"
                Resource: "*"
              - Sid: ReadAirflowAsViewer
                Effect: Allow
                Action:
                  - "airflow:InvokeRestApi"
                Resource: "arn:aws:airflow:*:*:role/*/Viewer"
        - PolicyName: FindTheCodeBehindALogGroupReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Which service writes a log group, so a fix goes to the repo its
              # code lives in: tags, a stack's resource list (names and types)
              # and image manifests only. No function configuration (it holds
              # environment variables), no function code, no stack
              # parameters, no image layers; nothing is changed.
              - Sid: DescribeServicesBehindLogGroups
                Effect: Allow
                Action:
                  - "ecs:ListClusters"
                  - "ecs:ListServices"
                  - "ecs:DescribeServices"
                  - "lambda:ListTags"
                  - "logs:ListTagsForResource"
                  - "cloudformation:ListStackResources"
                  - "ecr:BatchGetImage"
                  - "ecr:ListTagsForResource"
                Resource: "*"
        - PolicyName: BucketAndKeySettingsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Settings only, so a review can check a fact instead of asking:
              # a bucket's default encryption, its bucket policy and whether
              # that policy makes it public; a KMS key's description and key
              # policy. Never an object in a bucket, never an encrypt or
              # decrypt call.
              - Sid: ReadBucketAndKeySettings
                Effect: Allow
                Action:
                  - "s3:GetEncryptionConfiguration"
                  - "s3:GetBucketPolicy"
                  - "s3:GetBucketPolicyStatus"
                  - "kms:DescribeKey"
                  - "kms:GetKeyPolicy"
                Resource: "*"

Outputs:
  RoleArn:
    Description: >
      Copy this Role ARN and paste it into Coderhelm's AWS Connection settings.
    Value: !GetAtt CoderHelmLogReaderRole.Arn

  ExternalId:
    Description: The External ID used for this connection.
    Value: !Ref ExternalId
