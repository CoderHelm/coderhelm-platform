name: Public text guard

# The words a pull request publishes (title, branch name, body, commit messages, added
# lines under docs/) carry no ids from an install: AWS account ids, TEAM#
# ids, ULID run ids, Jira keys or email addresses
# (.github/scripts/text_guard.py). Customer names and hosts are CoderHelm's
# own "Customer details guard" check, which CI waits for. CI runs the same
# guard on every push; this workflow reruns it when the PR's title or body
# is edited, on its own so an edit never cancels or skips the build.
on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: read

concurrency:
  group: text-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Public text guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of the PR and the base it branched from.
          fetch-depth: 0
      - name: Guard tests
        run: python3 -m unittest discover -s .github/scripts -p test_text_guard.py
      # Reads the title and body from the event file, never from a script,
      # and prints only the place and the rule of a hit.
      - name: Scan the PR's text
        run: python3 .github/scripts/text_guard.py
