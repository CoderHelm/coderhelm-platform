name: Public text guard

# The words a pull request publishes (title, body, commit messages, added
# lines under docs/) carry no details from a customer install: no names or
# hosts from GUARD_DENYLIST, AWS account ids, TEAM# ids, ULID run ids, Jira
# keys or email addresses (.github/scripts/text_guard.py). It runs on its own,
# not in CI, so editing a PR's text reruns only this check and never cancels
# or skips the build.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: text-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Public text guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of the PR and the base it branched from.
          fetch-depth: 0
      - name: Guard tests
        run: python3 -m unittest discover -s .github/scripts -p test_text_guard.py
      # Reads the title and body from the event file, never from a script.
      # The denylist is a secret, so the runner masks it; the script masks
      # each entry again and prints only the place and the rule of a hit.
      - name: Scan the PR's text
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: python3 .github/scripts/text_guard.py
