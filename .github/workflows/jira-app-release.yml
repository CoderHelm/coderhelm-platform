name: Jira app release

# Publishes the Jira app (Forge, in coderhelm-jira/) whenever it changes on
# main, so no one deploys it by hand. See docs/jira-app-release.md.
#
# What it does: forge lint, deploy to staging (when that environment exists),
# deploy to production, then `forge install --upgrade` on every production
# installation that is behind. Code-only changes reach every site with no
# human step. A version that asks for new access (scopes, egress, a new
# dynamic web trigger...) still deploys, but each site's admin must accept it
# in Jira; the run summary says so and an issue is opened in this repo.
#
# This repo is public, and so are its run logs: site addresses are never
# printed (they are masked before any command that could echo them).
on:
  push:
    branches: [main]
    paths:
      - "coderhelm-jira/**"
      - ".github/workflows/jira-app-release.yml"
      - ".github/scripts/forge_release.py"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to release (an earlier commit rolls back)"
        required: false
        default: main

# One release at a time, and never cancel one halfway through.
concurrency:
  group: jira-app-release
  cancel-in-progress: false

permissions:
  contents: write # moves the jira-app-production tag to the released commit
  issues: write # opens an issue when a site admin must accept the update

env:
  FORGE_CLI_VERSION: 14.1.0
  RELEASED_TAG: jira-app-production

jobs:
  release:
    name: Release Jira app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coderhelm-jira
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Check Forge credentials
        working-directory: .
        run: |
          if [ -z "$FORGE_EMAIL" ] || [ -z "$FORGE_API_TOKEN" ]; then
            msg="FORGE_EMAIL and FORGE_API_TOKEN repository secrets are not set, so the Jira app cannot be released. See docs/jira-app-release.md."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # the permission check reads the last released manifest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            coderhelm-jira/package-lock.json
            coderhelm-jira/resources/admin/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          # The release script comes from the workflow's own commit, so a
          # rollback to a commit older than this workflow still works.
          git show "${GITHUB_SHA}:.github/scripts/forge_release.py" > "$RUNNER_TEMP/forge_release.py"
          npm install --global "@forge/cli@${FORGE_CLI_VERSION}"
          pip install --quiet pyyaml==6.0.2
          # The CLI asks about analytics on first use; answer it up front.
          forge settings set usage-analytics false

      - name: Install app dependencies and build the settings page
        run: |
          npm ci
          (cd resources/admin && npm ci && npm run build)

      - name: Unit tests
        run: npm test

      - name: Lint and check for new permissions
        id: perms
        run: |
          # Compare with the manifest of the last released commit (the
          # jira-app-production tag). Before the first automated release there
          # is no tag, so the parent commit stands in.
          git fetch --quiet --force origin "refs/tags/${RELEASED_TAG}:refs/tags/${RELEASED_TAG}" 2>/dev/null || true
          if git rev-parse --verify --quiet "refs/tags/${RELEASED_TAG}" >/dev/null; then
            base="${RELEASED_TAG}"
          else
            base="HEAD^"
          fi
          echo "Comparing with $(git rev-parse --short "$base") ($base)"
          git show "${base}:coderhelm-jira/manifest.yml" > "$RUNNER_TEMP/old-manifest.yml" 2>/dev/null || : > "$RUNNER_TEMP/old-manifest.yml"
          python3 "$RUNNER_TEMP/forge_release.py" diff \
            --old "$RUNNER_TEMP/old-manifest.yml" --new manifest.yml \
            --json "$RUNNER_TEMP/perms.json" | tee "$RUNNER_TEMP/perms.txt"
          grep -q '^needs_admin=true' "$RUNNER_TEMP/perms.txt" && na=true || na=false

          # Forge's own lint compares with what production runs now and flags
          # a major version (MAJOR_VERSION_RULE) that an admin must accept.
          # Either check saying so is enough.
          set +e
          forge lint --environment production > "$RUNNER_TEMP/lint.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/lint.txt"
          if grep -q MAJOR_VERSION_RULE "$RUNNER_TEMP/lint.txt"; then
            echo "Forge says this is a major version."
            na=true
            # Approve only that rule; any real lint error still fails here.
            forge lint --environment production --approve MAJOR_VERSION_RULE
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if [ "$na" = true ] && ! grep -q '^needs_admin=true' "$RUNNER_TEMP/perms.txt"; then
            python3 - "$RUNNER_TEMP/perms.json" <<'PY'
          import json, sys
          p = sys.argv[1]; r = json.load(open(p))
          r["needs_admin"] = True; r["reasons"].append("Forge lint reports a major version")
          json.dump(r, open(p, "w"), indent=2)
          PY
          fi
          python3 "$RUNNER_TEMP/forge_release.py" summary --json "$RUNNER_TEMP/perms.json" >> "$GITHUB_STEP_SUMMARY"
          echo "needs_admin=$na" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        run: |
          if forge environments list --non-interactive 2>/dev/null | grep -qiw staging; then
            # Staging is ours alone, so a major version is fine there.
            forge deploy --environment staging --non-interactive --approve MAJOR_VERSION_RULE
          else
            echo "No staging environment; skipping."
          fi

      - name: Deploy to production
        env:
          NEEDS_ADMIN: ${{ steps.perms.outputs.needs_admin }}
        run: |
          # A version that needs an admin still deploys: sites keep running
          # the previous major version until their admin accepts it.
          if [ "$NEEDS_ADMIN" = true ]; then
            forge deploy --environment production --non-interactive --approve MAJOR_VERSION_RULE
          else
            forge deploy --environment production --non-interactive
          fi

      - name: Mark the released commit
        run: |
          git tag --force "${RELEASED_TAG}" HEAD
          git push --force origin "refs/tags/${RELEASED_TAG}"

      - name: Upgrade production installations
        id: upgrade
        run: |
          # Minor versions reach every site by themselves. Installations still
          # on an older major version are upgraded here; that works on sites
          # where the token's account is a site admin, and elsewhere waits for
          # that site's admin to accept the update in Jira.
          forge install list --json > "$RUNNER_TEMP/installs.json" 2> "$RUNNER_TEMP/installs.err" || {
            echo "::warning::Could not list installations"; echo "listed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          python3 "$RUNNER_TEMP/forge_release.py" pending --installs "$RUNNER_TEMP/installs.json" > "$RUNNER_TEMP/pending.tsv"
          total=$(python3 -c 'import json,sys;print(sum(1 for i in json.load(open(sys.argv[1])) if str(i.get("environment","")).lower()=="production"))' "$RUNNER_TEMP/installs.json")
          rm -f "$RUNNER_TEMP/installs.json" "$RUNNER_TEMP/installs.err"
          upgraded=0; failed=0
          while IFS=$'\t' read -r site product; do
            [ -n "$site" ] || continue
            echo "::add-mask::$site"
            if forge install --upgrade --site "$site" --product "$product" \
                 --environment production --non-interactive --confirm-scopes; then
              upgraded=$((upgraded + 1))
            else
              failed=$((failed + 1))
            fi
          done < "$RUNNER_TEMP/pending.tsv"
          rm -f "$RUNNER_TEMP/pending.tsv"
          behind=$((upgraded + failed))
          echo "Production installations: $total; behind: $behind; upgraded: $upgraded; not upgraded: $failed"
          {
            echo "listed=true"; echo "total=$total"; echo "upgraded=$upgraded"; echo "failed=$failed"
          } >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## Installations"
            echo ""
            echo "Production installations: $total. Already current or updated by Forge: $((total - behind)). Upgraded now: $upgraded. Still waiting for a site admin: $failed."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed installation(s) could not be upgraded from CI; a site admin must accept the update in Jira (Apps → Manage apps → Coderhelm → Update)."
          fi

      - name: Tell someone when a site admin is needed
        if: steps.perms.outputs.needs_admin == 'true' || steps.upgrade.outputs.failed > 0
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.upgrade.outputs.failed || '0' }}
        run: |
          # The issue holds counts and manifest facts only, never site names.
          title="Jira app update needs a site admin"
          reasons=$(python3 -c 'import json,sys;print("\n".join("- "+r for r in json.load(open(sys.argv[1]))["reasons"]) or "- (no new access; an earlier major version is still pending)")' "$RUNNER_TEMP/perms.json")
          body=$(printf '%s\n\n%s\n\n%s\n%s\n\n%s\n' \
            "Release $(git rev-parse --short HEAD) of the Jira app is deployed, but it needs a site admin before every site runs it." \
            "$reasons" \
            "Installations not upgraded from CI: ${FAILED}." \
            "On each site, an admin opens Jira settings (gear) → Apps → Manage apps, finds Coderhelm and clicks Update." \
            "Run: ${RUN_URL}")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
