name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests (including from forks) get a read-only token and no secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every action pinned by commit SHA, no pull_request_target, no untrusted
  # values in scripts (.github/scripts/check_workflows.py), and actionlint.
  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pinned actions and safe triggers
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 .github/scripts/check_workflows.py
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --proto =https -fsSL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
      # Includes the reviewer evals (worker passes::review_eval): recorded
      # review histories replayed through the real decision code, no model.
      - run: cargo test --workspace

  lambda-tests:
    name: Lambda (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s lambda/tests
      # The Cognito pre-sign-up trigger, against the cases the gateway uses.
      - run: node --test lambda/pre-signup/handler.test.js

  mcp-proxy:
    name: MCP Proxy (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/mcp-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build

  jira-app:
    name: Jira app (Forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coderhelm-jira
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      # Pure rules only (no Forge runtime); `forge lint` needs a login and
      # runs in the release workflow (jira-app-release.yml).
      - run: npm test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The release workflow's permission check (scopes, egress, web triggers).
      - name: Release script tests
        working-directory: .
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 -m unittest discover -s .github/scripts

  infra:
    name: Infra (config, synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Config validation, hosted and self-host synth, the Launch Stack template.
      - run: npm test
      # A fresh self-host config with no domain synthesizes with the real CLI.
      # Stub Lambda code: synth only hashes it.
      - name: Synthesize the self-host example config
        run: |
          mkdir -p ../services/gateway/target/lambda/gateway ../services/worker/target/lambda/worker ../lambda/mcp-proxy/dist
          echo stub > ../services/gateway/target/lambda/gateway/bootstrap
          echo stub > ../services/worker/target/lambda/worker/bootstrap
          echo 'exports.handler = async () => {}' > ../lambda/mcp-proxy/dist/handler.js
          npx cdk synth --all --quiet -c config=config/selfhost.example.json -o "$RUNNER_TEMP/selfhost-synth"
          ls "$RUNNER_TEMP/selfhost-synth"/*.template.json
          if grep -l "coderhelm\.com" "$RUNNER_TEMP/selfhost-synth"/*.template.json; then
            echo "A self-host template mentions the hosted domain"; exit 1
          fi

  installer:
    name: Self-host installer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - run: npm test
      - run: sh -n ../selfhost/install.sh

  launch:
    name: Launch Stack (template and installer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      # The installer the stack runs, and the release's template stamping.
      - run: node --test selfhost/launch/*.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: cfn-lint the CloudFormation templates
        run: |
          pip install --quiet cfn-lint==1.58.0
          cfn-lint infra/cfn/*.yaml
