name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
      # Includes the reviewer evals (worker passes::review_eval): recorded
      # review histories replayed through the real decision code, no model.
      - run: cargo test --workspace

  lambda-tests:
    name: Lambda (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s lambda/tests

  mcp-proxy:
    name: MCP Proxy (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/mcp-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build
