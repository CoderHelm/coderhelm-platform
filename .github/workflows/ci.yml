name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
      # Includes the reviewer evals (worker passes::review_eval): recorded
      # review histories replayed through the real decision code, no model.
      - run: cargo test --workspace

  lambda-tests:
    name: Lambda (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s lambda/tests

  mcp-proxy:
    name: MCP Proxy (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/mcp-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build

  jira-app:
    name: Jira app (Forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coderhelm-jira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Pure rules only (no Forge runtime); `forge lint` needs a login and
      # runs in the release workflow (jira-app-release.yml).
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The release workflow's permission check (scopes, egress, web triggers).
      - name: Release script tests
        working-directory: .
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 -m unittest discover -s .github/scripts

  infra:
    name: Infra (config, synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Config validation, hosted and self-host synth, the Launch Stack template.
      - run: npm test
      # A fresh self-host config with no domain synthesizes with the real CLI.
      # Stub Lambda code: synth only hashes it.
      - name: Synthesize the self-host example config
        run: |
          mkdir -p ../services/gateway/target/lambda/gateway ../services/worker/target/lambda/worker ../lambda/mcp-proxy/dist
          echo stub > ../services/gateway/target/lambda/gateway/bootstrap
          echo stub > ../services/worker/target/lambda/worker/bootstrap
          echo 'exports.handler = async () => {}' > ../lambda/mcp-proxy/dist/handler.js
          npx cdk synth --all --quiet -c config=config/selfhost.example.json -o "$RUNNER_TEMP/selfhost-synth"
          ls "$RUNNER_TEMP/selfhost-synth"/*.template.json
          if grep -l "coderhelm\.com" "$RUNNER_TEMP/selfhost-synth"/*.template.json; then
            echo "A self-host template mentions the hosted domain"; exit 1
          fi

  installer:
    name: Self-host installer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
      - run: sh -n ../selfhost/install.sh
