name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pull requests (including from forks) get a read-only token and no secrets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every action pinned by commit SHA, no pull_request_target, no untrusted
  # values in scripts (.github/scripts/check_workflows.py), and actionlint.
  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pinned actions and safe triggers
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 .github/scripts/check_workflows.py
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --proto =https -fsSL -o "$RUNNER_TEMP/al.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/al.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # A signed release ships the dashboard commit reviewed here: a full SHA,
      # never a branch (selfhost/versions.json, scripts/bump-dashboard.sh).
      - name: The dashboard is pinned by commit
        run: node scripts/check-dashboard-ref.mjs

  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace -- -D warnings
      # Includes the reviewer evals (worker passes::review_eval): recorded
      # review histories replayed through the real decision code, no model.
      - run: cargo test --workspace

  # Every run failure that reached a person, replayed through the pipeline's
  # decision code with fakes only at the edges (docs/incidents.md).
  incidents:
    name: Incident regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services
          cache-on-failure: true
      - run: cargo test -p worker 'incidents::'

  lambda-tests:
    name: Lambda (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s lambda/tests
      # The Cognito pre-sign-up trigger, against the cases the gateway uses.
      - run: node --test lambda/pre-signup/handler.test.js

  mcp-proxy:
    name: MCP Proxy (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/mcp-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run build

  jira-app:
    name: Jira app (Forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coderhelm-jira
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # Pure rules only (no Forge runtime); `forge lint` needs a login and
      # runs in the release workflow (jira-app-release.yml).
      - run: npm test
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The release workflow's permission check (scopes, egress, web triggers).
      - name: Release script tests
        working-directory: .
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 -m unittest discover -s .github/scripts

  infra:
    name: Infra (config, synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Config validation, hosted and self-host synth, the Launch Stack template.
      - run: npm test
      # A fresh self-host config with no domain synthesizes with the real CLI.
      # Stub Lambda code: synth only hashes it.
      - name: Synthesize the self-host example config
        run: |
          mkdir -p ../services/gateway/target/lambda/gateway ../services/worker/target/lambda/worker ../lambda/mcp-proxy/dist
          echo stub > ../services/gateway/target/lambda/gateway/bootstrap
          echo stub > ../services/worker/target/lambda/worker/bootstrap
          echo 'exports.handler = async () => {}' > ../lambda/mcp-proxy/dist/handler.js
          npx cdk synth --all --quiet -c config=config/selfhost.example.json -o "$RUNNER_TEMP/selfhost-synth"
          ls "$RUNNER_TEMP/selfhost-synth"/*.template.json
          if grep -l "coderhelm\.com" "$RUNNER_TEMP/selfhost-synth"/*.template.json; then
            echo "A self-host template mentions the hosted domain"; exit 1
          fi

  installer:
    name: Self-host installer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm test
      - run: sh -n ../selfhost/install.sh

  native:
    name: Native release (templates, checker, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # The read-only checker and the release's model list.
      - run: node --test selfhost/launch/*.test.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # One release's parent and part templates from stub code, then cfn-lint
      # on them and on the log reader templates (infra/lib/native).
      - name: Build a native release and lint every template
        working-directory: infra
        run: |
          npm ci
          npx tsc -p .
          S="$RUNNER_TEMP/stubs" && mkdir -p "$S/gateway" "$S/worker" "$S/mcp" "$S/dash/_next"
          echo stub > "$S/gateway/bootstrap" && echo stub > "$S/worker/bootstrap" && echo 'exports.handler = async () => {}' > "$S/mcp/handler.js"
          echo '<html></html>' > "$S/dash/index.html" && echo x > "$S/dash/_next/a.js"
          GATEWAY_ZIP="$S/gateway" WORKER_ZIP="$S/worker" MCP_PROXY_DIR="$S/mcp" CODERHELM_DASHBOARD_DIR="$S/dash" node dist/lib/native/build.js v0.0.0-ci "$RUNNER_TEMP/native"
          pip install --quiet cfn-lint==1.58.0
          cfn-lint ../infra/cfn/*.yaml
          cfn-lint -i W3005 -i W2531 -- "$RUNNER_TEMP/native/coderhelm.json" "$RUNNER_TEMP/native"/stacks/*.json