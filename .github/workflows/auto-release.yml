name: Auto release

# Cuts, promotes and publishes self-host releases with no person in the loop
# and no stored signing key (docs/self-host/updates-security.md, "Automatic
# releases"). Two update channels (docs/self-host/updates.md, "Channels"):
#
#   beta     nightly: vX.Y.Z-beta.YYYYMMDD of main's deployed head, when
#            anything that ships changed since the last release. A GitHub
#            prerelease; launch/beta.json names it.
#   stable   vX.Y.Z: the newest beta, promoted once it has been out for a day
#            with no open "release-blocker" issue naming it (same commit,
#            same number without the suffix); or, for an urgent fix, cut
#            straight from the deployed commit (deploy.yml run by hand with
#            "stable release", or this file by hand with mode stable).
#            launch/latest.json names it (and beta.json, when newer).
#
# What starts it:
#   schedule 06:17     nightly: tonight's beta (once main's head is deployed).
#   schedule 10:17     the promotion: the newest beta out for a day becomes
#                      stable. Hours after the nightly run, so last night's
#                      beta (published by about 08:00) is a full day old.
#   deploy.yml         after its CDK deploy, by hand with "stable release":
#                      a stable release of exactly the commit it deployed.
#   by hand            mode promote (the newest ready beta, or the one in
#                      "version", whatever its age), beta or stable (main's
#                      head, once deployed).
#
#   plan      on refs/heads/main only: what to release
#             (.github/scripts/auto_release.py), or a skip.
#   tag       in the "release-auto" environment, which admits refs/heads/main
#             alone. A new release (beta or stable) signs the statement "this
#             repository, tag vX.Y.Z, commit C" keylessly: the Sigstore
#             certificate names this file on refs/heads/main, run on C, and
#             the signature is logged in Rekor. GitHub also attests the same
#             statement (for installs that check with gh). The signature goes
#             into the annotated tag's message; installs and updates accept a
#             tag without a maintainer's SSH signature only with it
#             (installer/lib/source-tag.mjs, infra/lib/release-verify.ts,
#             selfhost/install.sh, release.yml). A beta's run signs a second
#             statement, for the stable tag vX.Y.Z on the same commit, kept in
#             the beta's tag message; a promotion later checks that signature
#             and creates the stable tag with it, so the stable tag is
#             vouched for by exactly what installs already check (this file,
#             on main, run on the tag's commit). A tag is created, never
#             moved: GitHub refuses a ref that exists. Then Release
#             (release.yml) is started on the tag, which builds and signs
#             that tag's own files.
#   publish   in "release-auto" too. Waits for that Release run, checks the
#             published release as an install does, uploads the Launch Stack
#             and role templates, moves the channel's pointer (latest.json,
#             beta.json), checks the install link opens, and writes the
#             release notes. Its two AWS roles trust only this file on
#             refs/heads/main in "release-auto" (infra/lib/worker-stack.ts);
#             like release.yml's publish job, it runs no code from the
#             repository.
#
# Called by deploy.yml (workflow_call), the run is the deploy's own run: its
# ref is refs/heads/main and its commit is exactly the commit the deploy
# shipped, even when main has moved on since, so the certificate names that
# commit and installs accept it. A called workflow is read from the caller's
# own commit, so this file and release.yml are still that commit's reviewed
# copies, and the certificate still names this file (job_workflow_ref).
on:
  workflow_call:
    inputs:
      commit:
        description: The main commit the hosted deploy shipped (full SHA)
        required: true
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: "promote: a beta becomes stable now. beta or stable: a release of main's head now (once deployed)."
        required: true
        type: choice
        options: [promote, beta, stable]
        default: promote
      version:
        description: "promote only: the beta (vX.Y.Z-beta.YYYYMMDD) or the stable vX.Y.Z it becomes. Empty: the newest beta out for a day."
        required: false
        type: string
  schedule:
    # Nightly, 06:17 UTC: tonight's beta.
    - cron: "17 6 * * *"
    # 10:17 UTC: promote the newest beta that has been out for a day.
    - cron: "17 10 * * *"

permissions: {}

# One release at a time; a queued run plans again and finds the new tags.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the deploy's job results
      pull-requests: read # the notes
      issues: read # open release-blocker issues hold a promotion
    outputs:
      releases: ${{ steps.plan.outputs.releases || '[]' }}
      count: ${{ steps.plan.outputs.count || '0' }}
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      # A new release's signature names this run's ref and commit, and installs
      # require refs/heads/main and the tag's commit: the run must be on main,
      # on the commit that was deployed. Called from deploy.yml, the run's
      # commit is the deployed commit by construction. On the schedule or by
      # hand, it is main's head, released once main's deploy shipped it (the
      # nightly run waits for that deploy). A promotion signs nothing: the
      # beta's run signed its stable tag already.
      - id: guard
        name: On main, for the commit main's deploy shipped
        env:
          COMMIT_IN: ${{ inputs.commit }}
          ASKED: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Run this on main, not $GITHUB_REF"; exit 1; }
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main") mode=stable ;;
            "$GITHUB_REPOSITORY/.github/workflows/auto-release.yml@refs/heads/main")
              if [ "$EVENT" != schedule ]; then mode="$ASKED"
              elif [ "$SCHEDULE" = "17 10 * * *" ]; then mode=promote
              else mode=nightly; fi ;;
            *) echo "::error::Only deploy.yml, the schedule or a run by hand on main may start this, not $GITHUB_WORKFLOW_REF"; exit 1 ;;
          esac
          case "$mode" in promote | beta | stable | nightly) ;; *) echo "::error::unknown mode \"$mode\""; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"
          [ "$mode" = promote ] && exit 0
          COMMIT="${COMMIT_IN:-$GITHUB_SHA}"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full commit SHA"; exit 1; }
          if [ "$GITHUB_SHA" != "$COMMIT" ]; then
            echo "::error::This run is on $GITHUB_SHA, not $COMMIT: a release is cut only from the run of the commit it releases (the deploy of $COMMIT releases it)"
            exit 1
          fi
          deployed() {
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&head_sha=$COMMIT&per_page=20" --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id'); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "CDK Deploy" and .conclusion == "success")] | length')" -gt 0 ]; then echo "$run"; return 0; fi
            done
            return 1
          }
          # The nightly run waits for the deploy of main's head (the deploy
          # runs every 10 minutes); by hand, it must be deployed already.
          tries=1
          [ "$mode" = nightly ] && tries=45
          for i in $(seq 1 "$tries"); do
            if ok=$(deployed); then
              echo "Deployed by run $ok"
              echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$i" -lt "$tries" ] && sleep 60
          done
          if [ "$mode" = nightly ]; then
            echo "::warning::No successful CDK deploy of $COMMIT on main yet: no beta tonight"
            exit 0
          fi
          echo "::error::No successful CDK deploy of $COMMIT on main"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Versions, notes, or skip
        env:
          MODE: ${{ steps.guard.outputs.mode }}
          COMMIT: ${{ steps.guard.outputs.commit }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = nightly ]; then
            # Tonight's beta, once main's head is deployed (the guard waited).
            if [ -z "$COMMIT" ]; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            MODE=beta
          fi
          git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*' '+refs/heads/main:refs/remotes/origin/main'
          args=(--repo "$GITHUB_REPOSITORY" --mode "$MODE" --notes-dir "$RUNNER_TEMP/notes" --github-output "$GITHUB_OUTPUT")
          [ -n "$COMMIT" ] && args+=(--commit "$COMMIT")
          [ "$MODE" = promote ] && [ -n "$VERSION" ] && args+=(--version "$VERSION")
          python3 .github/scripts/auto_release.py plan "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.count != '0'
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 3

  tag:
    name: Attest and tag ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: release-auto
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    permissions:
      contents: write # the tag
      id-token: write # the keyless signature
      attestations: write # GitHub's attestation of the same statement
      actions: write # start release.yml on the tag
    env:
      KIND: ${{ matrix.kind }}
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ matrix.commit }}
      STABLE_TAG: ${{ matrix.stable_tag }}
      BETA: ${{ matrix.beta }}
    steps:
      - name: The run, the tag and the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::not main"; exit 1; }
          case "$GITHUB_WORKFLOW_REF" in
            "$GITHUB_REPOSITORY/.github/workflows/deploy.yml@refs/heads/main" | "$GITHUB_REPOSITORY/.github/workflows/auto-release.yml@refs/heads/main") ;;
            *) echo "::error::not started by deploy.yml, the schedule or by hand on main"; exit 1 ;;
          esac
          exists() { gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" >/dev/null 2>&1; }
          case "$KIND" in
            stable | beta)
              # A new release is signed by this run: only for its own commit.
              if [ "$GITHUB_SHA" != "$COMMIT" ]; then echo "::error::not main's deployed commit"; exit 1; fi
              if [ "$KIND" = stable ]; then
                [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
              else
                [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]{8}$ ]] || { echo "::error::$TAG is not vX.Y.Z-beta.YYYYMMDD"; exit 1; }
                [ "$STABLE_TAG" = "${TAG%-beta.*}" ] || { echo "::error::$TAG would become $STABLE_TAG"; exit 1; }
                if exists "$STABLE_TAG"; then echo "::error::$STABLE_TAG exists already"; exit 1; fi
                printf 'coderhelm-release-tag v1\nrepository %s\ntag %s\ncommit %s\n' "$GITHUB_REPOSITORY" "$STABLE_TAG" "$COMMIT" > "$RUNNER_TEMP/$STABLE_TAG.release-tag"
              fi
              ;;
            promote)
              # The beta's tag, read back from GitHub: on main, on this commit,
              # and carrying the signed statement for this stable tag.
              [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
              if ! [[ "$BETA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]{8}$ ]] || [ "${BETA%-beta.*}" != "$TAG" ]; then echo "::error::$BETA doesn't become $TAG"; exit 1; fi
              [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit"; exit 1; }
              ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BETA" --jq '.object.type + " " + .object.sha')
              read -r type sha <<< "$ref"
              [ "$type" = tag ] || { echo "::error::$BETA is not an annotated tag"; exit 1; }
              [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)" = "$COMMIT" ] || { echo "::error::$BETA is not on $COMMIT"; exit 1; }
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > "$RUNNER_TEMP/beta-message"
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
              case "$status" in ahead | identical) ;; *) echo "::error::$COMMIT is not on main ($status)"; exit 1 ;; esac
              B='-----BEGIN CODERHELM STABLE ATTESTATION-----'
              E='-----END CODERHELM STABLE ATTESTATION-----'
              { [ "$(grep -cxF -e "$B" "$RUNNER_TEMP/beta-message")" = 1 ] && [ "$(grep -cxF -e "$E" "$RUNNER_TEMP/beta-message")" = 1 ]; } \
                || { echo "::error::$BETA carries no signed statement for $TAG"; exit 1; }
              sed -n "/^$B\$/,/^$E\$/p" "$RUNNER_TEMP/beta-message" | sed '1d;$d' | base64 -d > "$RUNNER_TEMP/tag.sigstore.json"
              ;;
            *) echo "::error::unknown kind $KIND"; exit 1 ;;
          esac
          if exists "$TAG"; then echo "::error::$TAG exists already; a release tag is never re-cut or moved"; exit 1; fi
          printf 'coderhelm-release-tag v1\nrepository %s\ntag %s\ncommit %s\n' "$GITHUB_REPOSITORY" "$TAG" "$COMMIT" > "$RUNNER_TEMP/$TAG.release-tag"
          cat "$RUNNER_TEMP"/*.release-tag
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1
      - name: Sign the statements
        if: matrix.kind != 'promote'
        run: |
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/tag.sigstore.json" "$RUNNER_TEMP/$TAG.release-tag"
          if [ "$KIND" = beta ]; then
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/stable.sigstore.json" "$RUNNER_TEMP/$STABLE_TAG.release-tag"
          fi
      # A promotion checks the signature the beta's run made, for this tag
      # and the beta's commit, exactly as installs will.
      - name: Verify the signatures as installs will
        run: |
          verify() {
            cosign verify-blob --bundle "$1" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/auto-release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref refs/heads/main \
              --certificate-github-workflow-sha "$COMMIT" \
              "$2"
          }
          verify "$RUNNER_TEMP/tag.sigstore.json" "$RUNNER_TEMP/$TAG.release-tag"
          if [ "$KIND" = beta ]; then verify "$RUNNER_TEMP/stable.sigstore.json" "$RUNNER_TEMP/$STABLE_TAG.release-tag"; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: matrix.kind != 'promote'
        with:
          subject-path: ${{ runner.temp }}/*.release-tag
      # The annotated tag carries the signature (base64 of the bundle) in its
      # message; a beta's also carries its stable tag's. Creating the ref
      # fails when it exists, so nothing is moved.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="$RUNNER_TEMP/tag-message"
          {
            case "$KIND" in
              stable) printf '%s\n\nReleased automatically by .github/workflows/auto-release.yml after the deploy of main at %s.\n' "$TAG" "$COMMIT" ;;
              beta) printf '%s\n\nBeta (nightly) release, cut automatically by .github/workflows/auto-release.yml from main at %s.\nIt becomes %s on the stable channel after a day with no reported problem.\n' "$TAG" "$COMMIT" "$STABLE_TAG" ;;
              promote) printf '%s\n\nStable release: the beta %s (main at %s), promoted by .github/workflows/auto-release.yml.\n' "$TAG" "$BETA" "$COMMIT" ;;
            esac
            printf 'How to check it: docs/self-host/updates-security.md\n\n'
            echo "-----BEGIN CODERHELM RELEASE ATTESTATION-----"
            base64 -w 76 "$RUNNER_TEMP/tag.sigstore.json"
            echo "-----END CODERHELM RELEASE ATTESTATION-----"
            if [ "$KIND" = beta ]; then
              printf '\nThe signed statement for %s, used when this beta is promoted:\n' "$STABLE_TAG"
              echo "-----BEGIN CODERHELM STABLE ATTESTATION-----"
              base64 -w 76 "$RUNNER_TEMP/stable.sigstore.json"
              echo "-----END CODERHELM STABLE ATTESTATION-----"
            fi
          } > "$msg"
          obj=$(jq -n --rawfile m "$msg" --arg t "$TAG" --arg o "$COMMIT" '{tag: $t, message: $m, object: $o, type: "commit"}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/tags" --input - --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" >/dev/null
          echo "Created $TAG ($obj) on $COMMIT"
      # The tag, fetched back from GitHub, checks out as installs check it
      # (main's installer code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the tag as an install will
        run: |
          # shellcheck disable=SC2016 # JavaScript, not shell
          node --input-type=module -e '
            import { verifySourceTag } from "./installer/lib/source-tag.mjs";
            import { Runner } from "./installer/lib/runner.mjs";
            const commit = await verifySourceTag(process.env.TAG, { runner: new Runner({ log: () => {} }), log: console.log });
            if (commit !== process.env.COMMIT) { console.error(`the tag points to ${commit}, not ${process.env.COMMIT}`); process.exit(1); }
          '
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"

  publish:
    name: Publish ${{ matrix.tag }}
    needs: [plan, tag]
    # Each release on its own: a failed one never holds the other back.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: release-auto
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # One at a time: both may move beta.json.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    permissions:
      contents: write # the release notes
      id-token: write # the AWS roles
      actions: read # the Release run
    env:
      KIND: ${{ matrix.kind }}
      CHANNEL: ${{ matrix.channel }}
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ matrix.commit }}
      STABLE_TAG: ${{ matrix.stable_tag }}
      BETA: ${{ matrix.beta }}
      MODE: ${{ needs.plan.outputs.mode }}
      PUBLIC_BUCKET: coderhelm-public
    steps:
      - name: Wait for the Release run on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || { echo "::error::$TAG was not created (see its Attest and tag job)"; exit 1; }
          id=""
          for _ in $(seq 1 60); do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --branch "$TAG" --limit 5 --json databaseId,headBranch,headSha \
              --jq "[.[] | select(.headBranch == \"$TAG\" and .headSha == \"$COMMIT\")][0].databaseId // empty")
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::no Release run started on $TAG"; exit 1; }
          echo "Release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          while :; do
            read -r status conclusion < <(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            [ "$status" = completed ] && break
            sleep 60
          done
          [ "$conclusion" = success ] || { echo "::error::the Release run on $TAG ended: $conclusion"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1
      # The published release, downloaded from GitHub, checks out as an
      # install checks it: release.yml signed it on this tag from this commit,
      # and every file matches SHA256SUMS. Only then is anything published.
      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/published" && mkdir -p "$d"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$d"
          cosign verify-blob --bundle "$d/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/tags/$TAG" \
            --certificate-github-workflow-sha "$COMMIT" \
            "$d/SHA256SUMS"
          (cd "$d" && sha256sum -c SHA256SUMS)
          pre=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          want=false
          if [ "$CHANNEL" = beta ]; then want=true; fi
          [ "$pre" = "$want" ] || { echo "::error::$TAG's GitHub release has prerelease=$pre"; exit 1; }

      # Only the publish script, at this workflow's own commit: the job runs
      # nothing from the repository but that file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/publish-once.sh
          sparse-checkout-cone-mode: false
      # Same roles and same writes as release.yml's maintainer path: templates
      # are created once and never replaced, the pointers only move forward.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-release-publisher
          role-duration-seconds: 900
          aws-region: us-east-1
      - name: Upload the templates
        run: |
          d="$RUNNER_TEMP/published"
          # Written once: a key already there must hold this same file
          # (.github/scripts/publish-once.sh: one conditional PutObject per
          # file, in parallel, the parent coderhelm.json last).
          L="$RUNNER_TEMP/publish-list" && : > "$L"
          for f in coderhelm-log-reader.yaml coderhelm-log-reader-update.yaml; do printf '%s\t%s\t%s\n' "$d/$f" "launch/$TAG/$f" text/yaml >> "$L"; done
          # The native files (infra/lib/native), each checked against the
          # sha256 the signed coderhelm.json pins, then the parent last.
          mkdir -p "$RUNNER_TEMP/native" && tar -xzf "$d/coderhelm-native.tar.gz" -C "$RUNNER_TEMP/native"
          # shellcheck disable=SC2016 # JavaScript, not shell
          D="$d" node -e '
            const fs = require("fs"), c = require("crypto");
            const t = JSON.parse(fs.readFileSync(process.env.D + "/coderhelm.json", "utf8"));
            for (const f of t.Resources.ReleaseAssets.Properties.Files) {
              const got = c.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP + "/native/" + f.Key)).digest("hex");
              if (got !== f.Sha256) { console.error(`${f.Key} is not the file coderhelm.json pins`); process.exit(1); }
              console.log(f.Key);
            }' > "$RUNNER_TEMP/native-files"
          while read -r k; do
            case "$k" in *.json) ct=application/json ;; *) ct=application/zip ;; esac
            printf '%s\t%s\t%s\n' "$RUNNER_TEMP/native/$k" "launch/$TAG/$k" "$ct" >> "$L"
          done < "$RUNNER_TEMP/native-files"
          # The parent last: publish-once.sh uploads it after every other line.
          printf '%s\t%s\t%s\n' "$d/coderhelm.json" "launch/$TAG/coderhelm.json" application/json >> "$L"
          bash .github/scripts/publish-once.sh "$L"
          curl --proto =https -fsSL "https://$PUBLIC_BUCKET.s3.amazonaws.com/launch/$TAG/coderhelm.json" | cmp -s - "$d/coderhelm.json" \
            || { echo "::error::the template in S3 is not the signed coderhelm.json"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-release-latest
          role-duration-seconds: 900
          aws-region: us-east-1
      # Each channel's pointer names its newest release: latest.json the
      # newest stable one, beta.json the newest of either kind (so a stable
      # release moves both). A pointer only moves forward (a prerelease sorts
      # before its release, as in the updater), and the write is
      # conditional: a create, or a replace of the exact copy read (ETag).
      - name: Move the channel pointers
        run: |
          keys="beta.json"
          [ "$CHANNEL" = stable ] && keys="latest.json beta.json"
          SHA=$(sha256sum "$RUNNER_TEMP/published/coderhelm.json" | cut -d' ' -f1)
          export SHA
          for key in $keys; do
            headers="$RUNNER_TEMP/$key.headers"
            current=$(curl --proto =https -fsSL -D "$headers" "https://$PUBLIC_BUCKET.s3.amazonaws.com/launch/$key" 2>/dev/null || echo '{}')
            etag=$(sed -n 's/^[Ee][Tt][Aa][Gg]: *//p' "$headers" 2>/dev/null | tr -d '\r' | head -n1)
            rm -f "$key"
            # shellcheck disable=SC2016 # JavaScript, not shell
            CURRENT="$current" KEY="$key" node -e '
              const tag = process.env.TAG;
              const p = (v) => { const m = /^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(String(v || "")); return m ? [+m[1], +m[2], +m[3], m[4] || ""] : null; };
              const cmp = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return a[3] === b[3] ? 0 : !a[3] ? 1 : !b[3] ? -1 : a[3] < b[3] ? -1 : 1; };
              let cur = {};
              try { cur = JSON.parse(process.env.CURRENT); } catch {}
              const [a, b] = [p(tag), p(cur.version)];
              if (b && cmp(a, b) < 0) { console.error(`${process.env.KEY} names ${cur.version}, newer than ${tag}: left as it is`); process.exit(0); }
              const bucket = process.env.PUBLIC_BUCKET;
              require("fs").writeFileSync(process.env.KEY, JSON.stringify({
                version: tag,
                templateUrl: `https://${bucket}.s3.amazonaws.com/launch/${tag}/coderhelm.json`,
                templateSha256: process.env.SHA,
                publishedAt: new Date().toISOString(),
              }));
            '
            [ -f "$key" ] || continue
            if [ -n "$etag" ]; then
              aws s3api put-object --bucket "$PUBLIC_BUCKET" --key "launch/$key" --body "$key" --if-match "$etag" --content-type application/json --cache-control "public, max-age=300" >/dev/null
            else
              aws s3api put-object --bucket "$PUBLIC_BUCKET" --key "launch/$key" --body "$key" --if-none-match '*' --content-type application/json --cache-control "public, max-age=300" >/dev/null
            fi
            echo "launch/$key: $TAG"
          done
      # The install guide's link (latest.json), and the beta channel's: each
      # names a template that opens.
      - name: The install link opens
        run: |
          keys="beta.json"
          [ "$CHANNEL" = stable ] && keys="latest.json beta.json"
          for key in $keys; do
            url=$(curl --proto =https -fsSL "https://$PUBLIC_BUCKET.s3.amazonaws.com/launch/$key" | jq -r .templateUrl)
            curl --proto =https -fsSI "$url" >/dev/null || { echo "::error::$key names $url, which does not open"; exit 1; }
            echo "$key: $url"
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # The notes go on the GitHub release: self-hosted installs read them
      # there (Settings, then System) and email their admins about it.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/release-notes.md"
          {
            case "$KIND" in
              stable) echo "Self-host release ${TAG}, cut right away after the deploy of main at ${COMMIT}." ;;
              beta) echo "Beta (nightly) self-host release ${TAG}, from main at ${COMMIT}. Installs on the Beta channel get it. It becomes ${STABLE_TAG} on the Stable channel after a day with no reported problem." ;;
              promote)
                if [ "$MODE" = promote ]; then how="promoted by a maintainer"; else how="promoted after a day on the Beta channel with no reported problem"; fi
                echo "Self-host release ${TAG}: the beta ${BETA} (main at ${COMMIT}), ${how}." ;;
            esac
            echo
            echo "Install: \`npx -y github:${GITHUB_REPOSITORY}#${TAG} init\`, then deploy. Update: \`npx -y github:${GITHUB_REPOSITORY}#${TAG} update --to ${TAG}\`. Check an install: \`npx -y github:${GITHUB_REPOSITORY} doctor\`. Verify it yourself: docs/self-host/updates-security.md."
            echo
            cat "$RUNNER_TEMP/notes/$TAG.md"
          } > "$f"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$f"
          url=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url)
          { echo "### Released [$TAG]($url)"; echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Released $TAG: $url"
