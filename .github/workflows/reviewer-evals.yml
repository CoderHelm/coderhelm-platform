name: Reviewer evals (live)

# The model-in-the-loop layer of the reviewer evals: the recorded comments
# and replies in services/worker/src/passes/review_cases are read by the real
# model, and each must land in its case's outcome class; each case's diff
# (live_review) is reviewed with the reviewer's own prompt and critic. The deterministic
# layer runs on every PR in CI; this one costs model calls, so it runs
# nightly. A failure opens an issue.
#
# Model access: no model key is stored in GitHub. The job exchanges GitHub's
# OIDC token for short-lived AWS credentials of the `coderhelm-prod-reviewer-evals`
# role (infra/lib/worker-stack.ts). That role trusts only this repository's
# main branch and may only invoke the eval model and the reviewer's model on
# Amazon Bedrock; the evals send the same Messages requests the worker sends
# to Anthropic.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      review_model:
        description: >-
          The model the diff reviews run on (the classification checks stay on
          the eval model). The role may invoke only the models it lists in
          infra/lib/worker-stack.ts.
        type: choice
        default: us.anthropic.claude-opus-5-5
        options:
          - us.anthropic.claude-opus-5-5
          - us.anthropic.claude-sonnet-5-5
      critic_model:
        description: >-
          The model the review critic runs on (it decides which findings are
          kept, and so what blocks). same: the review model.
        type: choice
        default: same
        options:
          - same
          - us.anthropic.claude-opus-5-5
          - us.anthropic.claude-sonnet-5-5
      suite:
        description: >-
          nightly: the recorded cases (as the schedule runs them).
          route-review: the synthetic review measurement (review_cases/measure).
          route-implement: the synthetic implement measurement
          (model_route_cases/implement), on implement_model.
        type: choice
        default: nightly
        options:
          - nightly
          - route-review
          - route-implement
      implement_model:
        description: The model the coder runs on (route-implement only).
        type: choice
        default: us.anthropic.claude-opus-5-5
        options:
          - us.anthropic.claude-opus-5-5
          - us.anthropic.claude-sonnet-5-5
      repeat:
        description: How many times each measurement runs (route suites; 1 to 5).
        type: string
        default: "1"

permissions:
  contents: read
  issues: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  AWS_REGION: us-east-1

jobs:
  live:
    name: Reviewer evals (live model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-reviewer-evals
          role-session-name: reviewer-evals-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run the live evals
        env:
          EVAL_PROVIDER: bedrock
          # Classification checks: the cheap model.
          EVAL_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
          # Diff reviews: the model the reviewer runs on in production
          # (infra/lib/worker-stack.ts evalReviewModel), unless a manual run
          # picked another (the nightly run has no inputs).
          EVAL_REVIEW_MODEL: ${{ inputs.review_model || 'us.anthropic.claude-opus-5-5' }}
          EVAL_CRITIC_MODEL: ${{ (inputs.critic_model != '' && inputs.critic_model != 'same') && inputs.critic_model || inputs.review_model || 'us.anthropic.claude-opus-5-5' }}
          EVAL_IMPLEMENT_MODEL: ${{ inputs.implement_model || 'us.anthropic.claude-opus-5-5' }}
          EVAL_REPEAT: ${{ inputs.repeat || '1' }}
          SUITE: ${{ inputs.suite || 'nightly' }}
        run: |
          case "$SUITE" in
            route-review) filter=model_route_eval::route_review_live ;;
            route-implement) filter=model_route_eval::route_implement_live ;;
            *) filter=review_eval ;;
          esac
          cargo test -p worker "$filter" -- --ignored --nocapture 2>&1 | tee eval.log
        shell: bash -o pipefail {0}
      - name: Measurement summary
        if: always() && inputs.suite != '' && inputs.suite != 'nightly'
        run: grep -h '^ROUTE_EVAL' eval.log > route-eval.jsonl || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.suite != '' && inputs.suite != 'nightly'
        with:
          name: route-eval-${{ github.run_id }}
          path: services/route-eval.jsonl
      - name: Open an issue on failure
        if: failure() && (github.event_name == 'schedule' || inputs.suite == 'nightly')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The nightly reviewer evals failed on \`${GITHUB_SHA::7}\`."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            if [ -f eval.log ]; then
              grep -A40 "eval failures" eval.log | head -60 || tail -40 eval.log
            else
              echo "The evals did not run (setup failed before them)."
            fi
            echo '```'
          } > issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Reviewer evals failed ($(date -u +%F))" --body-file issue.md
