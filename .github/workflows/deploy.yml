name: Deploy

# Batched deploys: instead of a full build+deploy on every push to main (a stack
# of back-to-back deploys when several PRs merge), a 10-min schedule coalesces all
# merges in the window into ONE deploy. The gate job skips the run when main hasn't
# changed since the last successful deploy, so idle windows cost nothing.
# `workflow_dispatch` is the on-demand escape hatch (always deploys).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Serialize deploys and NEVER abort a live one (cancel-in-progress: false) — a
# cancelled CDK deploy can leave a half-applied stack. A run that fires mid-deploy
# queues; by the time it runs, the gate sees nothing new and skips.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (batch window)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.g.outputs.changed }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual dispatch always deploys.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — deploying"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUR="${{ github.sha }}"
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          echo "current=$CUR  last_deployed=$LAST"
          # Fail-open: deploy unless we're CERTAIN main is already deployed, so a
          # query hiccup can never silently stop deploys.
          if [ -n "$LAST" ] && [ "$CUR" = "$LAST" ]; then
            echo "no new commits since last successful deploy — skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Rust (workspace)
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-unknown-linux-musl
      # Cache ~/.cargo/registry + services/target in one hit for both crates
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services
          cache-on-failure: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: pip3 install --retries 3 --timeout 60 cargo-zigbuild
      # Build both gateway + worker in one invocation — shared deps compiled once
      - name: Build workspace
        working-directory: services
        run: cargo zigbuild --workspace --release --target aarch64-unknown-linux-musl
      - name: Package artifacts
        run: |
          cp services/target/aarch64-unknown-linux-musl/release/gateway bootstrap
          zip gateway.zip bootstrap
          rm bootstrap
          cp services/target/aarch64-unknown-linux-musl/release/worker bootstrap
          zip worker.zip bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway
          path: gateway.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker
          path: worker.zip

  deploy:
    name: CDK Deploy
    needs: [gate, build]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gateway
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: worker
          path: artifacts/

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build MCP Proxy
        working-directory: lambda/mcp-proxy
        run: npm ci && npm run build

      - working-directory: infra
        run: npm ci
      - working-directory: infra
        run: npx cdk deploy --all --require-approval never
        env:
          GATEWAY_ZIP: ${{ github.workspace }}/artifacts/gateway.zip
          WORKER_ZIP: ${{ github.workspace }}/artifacts/worker.zip
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          MODEL_ID: claude-opus-4-8

  # A deploy of main that went through starts a self-host release of that
  # commit (.github/workflows/auto-release.yml). That workflow plans, skips
  # when nothing self-hosted installs run changed, and checks again that it
  # runs on main for a commit this workflow deployed.
  release:
    name: Start the self-host release
    needs: [gate, deploy]
    if: needs.gate.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write # start auto-release.yml (workflow_dispatch)
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-release.yml -R "$GITHUB_REPOSITORY" --ref main -f commit="$GITHUB_SHA"
