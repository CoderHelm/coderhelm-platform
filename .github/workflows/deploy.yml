name: Deploy

# Batched deploys: instead of a full build+deploy on every push to main (a stack
# of back-to-back deploys when several PRs merge), a 10-min schedule coalesces all
# merges in the window into ONE deploy. The gate job skips the run when main hasn't
# changed since the last successful deploy, so idle windows cost nothing.
# `workflow_dispatch` is the on-demand escape hatch (always deploys).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Serialize deploys and NEVER abort a live one (cancel-in-progress: false) — a
# cancelled CDK deploy can leave a half-applied stack. A run that fires mid-deploy
# queues; by the time it runs, the gate sees nothing new and skips.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (batch window)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.g.outputs.changed }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual dispatch always deploys.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — deploying"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUR="${{ github.sha }}"
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          echo "current=$CUR  last_deployed=$LAST"
          # Fail-open: deploy unless we're CERTAIN main is already deployed, so a
          # query hiccup can never silently stop deploys.
          if [ -n "$LAST" ] && [ "$CUR" = "$LAST" ]; then
            echo "no new commits since last successful deploy — skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The Rust Lambdas, built once per change to what they're built from: a
  # deploy whose Rust inputs (scripts/rust-inputs.mjs) match an earlier
  # successful deploy of main reuses that build after checking its sha256
  # (.github/scripts/rust-build-reuse.sh); anything else builds. Either way
  # the run uploads "rust-build" (the zips and rust-build.json), which the
  # self-host release of this commit reuses the same way (release.yml).
  build:
    name: Build Rust (workspace)
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # an earlier deploy's build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: inputs
        name: What the Lambdas are built from
        run: echo "digest=$(node scripts/rust-inputs.mjs)" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: An earlier deploy built the same inputs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS: ${{ steps.inputs.outputs.digest }}
        run: bash .github/scripts/rust-build-reuse.sh deploy rust-build "$INPUTS" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.reuse.outputs.hit != 'true'
        with:
          targets: aarch64-unknown-linux-musl
      # Cache ~/.cargo/registry + services/target in one hit for both crates
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.reuse.outputs.hit != 'true'
        with:
          workspaces: services
          cache-on-failure: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.reuse.outputs.hit != 'true'
      - name: Install cargo-zigbuild
        if: steps.reuse.outputs.hit != 'true'
        run: pip3 install --retries 3 --timeout 60 cargo-zigbuild==0.24.0
      # The same build the release runs: gateway + worker in one invocation.
      - name: Build workspace
        if: steps.reuse.outputs.hit != 'true'
        run: bash scripts/rust-build.sh rust-build
      - name: The build's manifest
        env:
          INPUTS: ${{ steps.inputs.outputs.digest }}
          HIT: ${{ steps.reuse.outputs.hit }}
          BUILT_AT: ${{ steps.reuse.outputs.built_at }}
          BUILD_RUN: ${{ steps.reuse.outputs.build_run }}
        run: |
          if [ "$HIT" != true ]; then BUILT_AT=$GITHUB_SHA; BUILD_RUN=$GITHUB_RUN_ID; fi
          jq -n --arg inputs "$INPUTS" --arg commit "$GITHUB_SHA" --arg built_at "$BUILT_AT" --arg build_run "$BUILD_RUN" \
            --arg gw "$(sha256sum rust-build/gateway.zip | cut -d' ' -f1)" --arg wk "$(sha256sum rust-build/worker.zip | cut -d' ' -f1)" \
            '{inputs: $inputs, commit: $commit, built_at: $built_at, build_run: $build_run, files: {"gateway.zip": $gw, "worker.zip": $wk}}' > rust-build/rust-build.json
          cat rust-build/rust-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-build
          path: rust-build/
          if-no-files-found: error

  deploy:
    name: CDK Deploy
    needs: [gate, build]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-build
          path: artifacts/
      - name: The build is the one its manifest lists
        working-directory: artifacts
        run: |
          for f in gateway.zip worker.zip; do
            echo "$(jq -r --arg f "$f" '.files[$f]' rust-build.json)  $f"
          done | sha256sum -c -

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build MCP Proxy
        working-directory: lambda/mcp-proxy
        run: npm ci && npm run build

      - working-directory: infra
        run: npm ci
      # Stacks with no dependency between them deploy side by side; CDK still
      # waits for each stack's dependencies, and skips one with no changes.
      - working-directory: infra
        run: npx cdk deploy --all --require-approval never --concurrency 4
        env:
          GATEWAY_ZIP: ${{ github.workspace }}/artifacts/gateway.zip
          WORKER_ZIP: ${{ github.workspace }}/artifacts/worker.zip
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          MODEL_ID: claude-opus-4-8

  # A deploy of main that went through releases exactly the commit it
  # deployed (.github/workflows/auto-release.yml), in this same run, so a
  # merge to main during the deploy never skips or changes the release. That
  # workflow plans, skips when nothing self-hosted installs run changed or a
  # later commit is already released, and checks again that it runs on main
  # for a commit this workflow deployed.
  release:
    name: Self-host release
    needs: [gate, deploy]
    if: needs.gate.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/auto-release.yml
    permissions:
      contents: write # the tag and the release notes
      id-token: write # the keyless signature and the AWS roles
      attestations: write # GitHub's attestation of the tag statement
      actions: write # the deploy's job results; start release.yml on the tag
      pull-requests: read # the notes
    with:
      commit: ${{ github.sha }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
