name: Release

# A tag vX.Y.Z publishes a self-host release: prebuilt Lambda code (no Rust
# toolchain needed to install), the dashboard build, the CDK app's source,
# the installer, the install script and the Launch Stack template (also
# published to S3 for the Launch Stack link), with SHA256SUMS, its keyless
# signature and build provenance (GitHub artifact attestations: Sigstore,
# no keys to manage). The hosted deployment is not touched by this workflow.
#
# A release tag comes one of two ways (docs/self-host/updates-security.md):
#   maintainer  a person signs and pushes it (git tag -s, a key in main's
#               selfhost/maintainers.json); the publish job then waits for a
#               maintainer's approval of the "release" environment and also
#               uploads the Launch Stack templates and moves latest.json.
#   automatic   .github/workflows/auto-release.yml creates it after main's
#               deploy, with a keyless signature of "this repository, this
#               tag, this commit" in its message, and starts this workflow on
#               it. The publish job signs and publishes the GitHub release
#               with no approval; auto-release.yml then checks it and uploads
#               the templates and latest.json itself, from main, in the
#               "release-auto" environment (main only).
#
#   check     the tag is an annotated vX.Y.Z tag on a commit on main, and
#             either signed with a key in main's selfhost/maintainers.json or
#             attested by auto-release.yml on main for this tag and commit.
#   build     builds everything with a read-only token and no secrets; the
#             dashboard from the full commit SHA in selfhost/versions.json.
#   publish   signs, attests and publishes. On a maintainer's tag it runs in
#             the "release" environment, so a maintainer must approve it, and
#             only then can it assume the AWS roles (whose trust names this
#             file, a v* tag and that environment: infra/lib/worker-stack.ts).
#
# These checks run inside this file, so on their own they don't stop a
# changed copy of it pushed under a new tag. What does: installs and updates
# check that the signature names exactly this file on refs/tags/<version>,
# AND that it was made from the commit the tag points to, AND that the tag is
# on main and signed with a pinned maintainer key or attested by main's
# auto-release.yml for that tag and commit (installer/lib/source-tag.mjs,
# infra/lib/release-verify.ts). A tag that neither a maintainer key nor
# auto-release.yml on main vouched for gets nothing installed, whatever this
# file says.
#
# Every action is pinned by commit SHA (.github/scripts/check_workflows.py
# fails CI otherwise).
on:
  push:
    tags: ["v*.*.*"]
  # Re-run for an existing tag: choose the tag in "Use workflow from"
  # (the signature names the ref the run is on, so it must be the tag).
  # auto-release.yml starts it this way on the tag it created.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      path: ${{ steps.path.outputs.path }}
    steps:
      - id: tag
        name: A version tag, nothing else
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "::error::Run this on a tag (vX.Y.Z), not a branch"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      # The tag must point at reviewed code: a commit on main (which needs a
      # PR, signed commits and passing checks), and this run must be on it
      # (the signing certificate names this run's commit; installs require
      # it to be the tag's).
      - name: The tag is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$TAG ($commit) is not on main"; exit 1; }
          [ "$GITHUB_SHA" = "$commit" ] || { echo "::error::this run is on $GITHUB_SHA, not $TAG's commit $commit"; exit 1; }
      # Who vouches for the tag, as installs check it (installer/lib/source-tag.mjs):
      # a maintainer's SSH signature (with a key pinned in main's copy of
      # selfhost/maintainers.json, not the tag's) when the tag has one, or
      # else the release attestation auto-release.yml on main put in it.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1
      - id: path
        name: The tag is signed with a maintainer key or attested by auto-release.yml on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git cat-file tag "refs/tags/$TAG" > "$RUNNER_TEMP/tag"
          sed -n '/^$/q;s/^tag //p' "$RUNNER_TEMP/tag" | grep -qxF "$TAG" || { echo "::error::the tag object under $TAG is named for another version"; exit 1; }
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if grep -qxF -e '-----BEGIN SSH SIGNATURE-----' "$RUNNER_TEMP/tag"; then
            # shellcheck disable=SC2016 # JavaScript, not shell
            git show origin/main:selfhost/maintainers.json \
              | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{for(const k of JSON.parse(s).keys)console.log(`${k.login} namespaces="git" ${k.key}`)})' > "$RUNNER_TEMP/allowed_signers"
            [ "$(grep -cxF -e '-----BEGIN SSH SIGNATURE-----' "$RUNNER_TEMP/tag")" = 1 ] || { echo "::error::$TAG has more than one SSH signature"; exit 1; }
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" -c gpg.ssh.program=ssh-keygen verify-tag "refs/tags/$TAG" \
              || { echo "::error::$TAG is not signed with a key in selfhost/maintainers.json (git tag -s with your SSH signing key)"; exit 1; }
            echo "path=maintainer" >> "$GITHUB_OUTPUT"
          else
            B='-----BEGIN CODERHELM RELEASE ATTESTATION-----'
            E='-----END CODERHELM RELEASE ATTESTATION-----'
            { [ "$(grep -cxF -e "$B" "$RUNNER_TEMP/tag")" = 1 ] && [ "$(grep -cxF -e "$E" "$RUNNER_TEMP/tag")" = 1 ]; } \
              || { echo "::error::$TAG has no maintainer signature and no release attestation from auto-release.yml"; exit 1; }
            sed -n "/^$B\$/,/^$E\$/p" "$RUNNER_TEMP/tag" | sed '1d;$d' | base64 -d > "$RUNNER_TEMP/tag.sigstore.json"
            printf 'coderhelm-release-tag v1\nrepository %s\ntag %s\ncommit %s\n' "$GITHUB_REPOSITORY" "$TAG" "$commit" > "$RUNNER_TEMP/statement"
            cosign verify-blob --bundle "$RUNNER_TEMP/tag.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/auto-release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref refs/heads/main \
              --certificate-github-workflow-sha "$commit" \
              "$RUNNER_TEMP/statement" \
              || { echo "::error::$TAG's release attestation is not from auto-release.yml on main for this tag and commit"; exit 1; }
            echo "path=automatic" >> "$GITHUB_OUTPUT"
          fi
      # GitHub's own check: a maintainer's tag signature verifies, and the
      # commit is signed (main requires signed commits).
      - name: The tag and its commit are signed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VOUCHED: ${{ steps.path.outputs.path }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          read -r type sha <<< "$ref"
          [ "$type" = tag ] || { echo "::error::$TAG is a lightweight tag: make it with git tag -s $TAG -m $TAG"; exit 1; }
          if [ "$VOUCHED" = maintainer ]; then
            [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .verification.verified)" = true ] || { echo "::error::$TAG's signature is missing or not verified by GitHub"; exit 1; }
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .commit.verification.verified)" = true ] || { echo "::error::$TAG's commit is not signed and verified"; exit 1; }
      # The updater and the installer compare versions: a release must sort
      # above every earlier one, including the v0.2.x to v0.6.0 tags from
      # before self-hosting (they have no releases). The first self-host
      # release is v0.7.0. The installer's version must match the tag, and
      # MIGRATIONS.json must be valid JSON.
      - name: Check the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node scripts/check-dashboard-ref.mjs
          # shellcheck disable=SC2016 # JavaScript, not shell
          node -e '
            const tag = process.env.TAG;
            const n = (v) => v.replace(/^v/, "").split(/[.-]/).slice(0, 3).map(Number);
            const [a, b] = [n(tag), n("v0.6.0")];
            const above = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];
            if (!above) { console.error(`${tag} must sort above v0.6.0 (the last tag from before self-hosting); the first self-host release is v0.7.0`); process.exit(1); }
            const pkg = require("./installer/package.json").version;
            if (`v${pkg}` !== tag.replace(/-.*/, "") && `v${pkg}` !== tag) console.log(`note: installer/package.json says ${pkg}; the release stamps ${tag}`);
            require("./selfhost/MIGRATIONS.json");
          '

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    # Read-only token, no secrets, no OIDC: this job runs the build scripts.
    permissions:
      contents: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # ── Rust Lambdas (no build cache: a release builds from scratch) ──
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: pip3 install --retries 3 --timeout 60 cargo-zigbuild==0.24.0
      - name: Build gateway and worker
        working-directory: services
        run: cargo zigbuild --locked --workspace --release --target aarch64-unknown-linux-musl
      - name: Package Lambdas
        run: |
          mkdir -p dist
          for b in gateway worker; do
            cp services/target/aarch64-unknown-linux-musl/release/$b bootstrap
            zip -q -X dist/$b.zip bootstrap
            rm bootstrap
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      # ── MCP proxy ──────────────────────────────────────────────────
      - name: Build the MCP proxy
        working-directory: lambda/mcp-proxy
        run: npm ci && npm run build && (cd dist && zip -q -r -X ../../../dist/mcp-proxy.zip .)

      # ── Dashboard (the full commit SHA selfhost/versions.json names) ──
      # A branch name is refused (scripts/check-dashboard-ref.mjs): a signed
      # release ships the dashboard commit reviewed in this repository.
      - name: Pick the dashboard commit
        id: dash
        run: |
          node scripts/check-dashboard-ref.mjs
          echo "ref=$(node -p 'require("./selfhost/versions.json").dashboardRef')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CoderHelm/coderhelm
          ref: ${{ steps.dash.outputs.ref }}
          path: dashboard-src
          persist-credentials: false
      - name: The dashboard checkout is that commit
        env:
          WANT: ${{ steps.dash.outputs.ref }}
        run: |
          got=$(git -C dashboard-src rev-parse HEAD)
          [ "$got" = "$WANT" ] || { echo "::error::checked out $got, not $WANT"; exit 1; }
      - name: Build the dashboard
        working-directory: dashboard-src/dashboard
        # No API URL baked in: a self-hosted deployment serves
        # runtime-config.js next to the pages (infra/lib/web-stack.ts).
        env:
          NEXT_PUBLIC_SELF_HOSTED: "1"
        run: |
          npm ci
          npm run build
          test -f out/index.html
          tar -czf "$GITHUB_WORKSPACE/dist/dashboard.tar.gz" -C out .

      # ── Source, installer, script, template ────────────────────────
      - name: Source and installer
        run: |
          # The source, plus the release stamp each install shows (Settings, then System).
          SRC="$RUNNER_TEMP/src/coderhelm-platform-${TAG#v}"
          mkdir -p "$SRC" && git archive --format=tar "$TAG" | tar -x -C "$SRC"
          printf '{"version":"%s","commit":"%s","dashboardCommit":"%s","releasedAt":"%s"}\n' "$TAG" "$(git rev-parse "$TAG^{commit}")" "$(git -C dashboard-src rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$SRC/selfhost/release.json"
          tar -czf dist/source.tar.gz -C "$RUNNER_TEMP/src" "coderhelm-platform-${TAG#v}"
          # The installer checks a release's tag against these keys (installer/lib/source-tag.mjs).
          cp selfhost/maintainers.json installer/lib/maintainers.json
          (cd installer && npm version --no-git-tag-version --allow-same-version "${TAG#v}" >/dev/null && npm pack --silent --pack-destination ../dist >/dev/null)
          mv dist/coderhelm-selfhost-*.tgz dist/coderhelm-selfhost.tgz
          cp selfhost/install.sh dist/install.sh
          # The read-only role teams create in their own AWS accounts, and the
          # stack that brings an existing role up to date: byte for byte the
          # templates built into this release's gateway
          # (services/common/src/log_reader.rs), published by version so a
          # self-hosted install's Launch Stack links match its code.
          cp infra/cfn/coderhelm-log-reader.yaml dist/coderhelm-log-reader.yaml
          cp infra/cfn/coderhelm-log-reader-update.yaml dist/coderhelm-log-reader-update.yaml
          # The models this release calls, read from the code, with their
          # Bedrock ids per inference profile prefix. In the signed
          # SHA256SUMS: the updater reads it only through the update build,
          # after the signature check (lambda/updater, model_check).
          node selfhost/launch/release-models.mjs "$TAG" > dist/models.json

      # The release's own CDK app synthesizes for a fresh self-host config.
      - name: Synth check
        working-directory: infra
        env:
          GATEWAY_ZIP: ${{ github.workspace }}/dist/gateway.zip
          WORKER_ZIP: ${{ github.workspace }}/dist/worker.zip
          MCP_PROXY_DIR: ${{ github.workspace }}/dist/mcp-proxy.zip
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/dash" && tar -xzf ../dist/dashboard.tar.gz -C "$RUNNER_TEMP/dash"
          CODERHELM_DASHBOARD_DIR="$RUNNER_TEMP/dash" npx cdk synth --all --quiet -c config=config/selfhost.example.json -o "$RUNNER_TEMP/synth"

      # The native release (one CloudFormation stack per install): the parent
      # template Launch Stack opens, and the parts and code it pins by
      # sha256 (infra/lib/native). coderhelm.json is in the signed
      # SHA256SUMS; every other native file is checked against the sha256 in
      # coderhelm.json, by the install itself before anything runs.
      - name: Native release
        working-directory: infra
        env:
          GATEWAY_ZIP: ${{ github.workspace }}/dist/gateway.zip
          WORKER_ZIP: ${{ github.workspace }}/dist/worker.zip
          MCP_PROXY_DIR: ${{ github.workspace }}/dist/mcp-proxy.zip
        run: |
          npx tsc -p .
          CODERHELM_DASHBOARD_DIR="$RUNNER_TEMP/dash" node dist/lib/native/build.js "$TAG" "$RUNNER_TEMP/native"
          pip install --quiet cfn-lint==1.58.0
          cfn-lint -i W3005 -i W2531 -- "$RUNNER_TEMP/native/coderhelm.json" "$RUNNER_TEMP/native"/stacks/*.json
          cp "$RUNNER_TEMP/native/coderhelm.json" ../dist/coderhelm.json
          tar -czf ../dist/coderhelm-native.tar.gz -C "$RUNNER_TEMP/native" stacks assets
      - name: Checksums
        run: |
          (cd dist && sha256sum gateway.zip worker.zip mcp-proxy.zip dashboard.tar.gz source.tar.gz coderhelm-selfhost.tgz install.sh coderhelm.json coderhelm-native.tar.gz models.json coderhelm-log-reader.yaml coderhelm-log-reader-update.yaml > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # Signs, attests and publishes what the build made; runs no code from the
  # repository (no checkout). A maintainer's tag runs only after a reviewer
  # approves the "release" environment, and only then gets the AWS roles for
  # the templates and latest.json. An automatic tag runs with no environment:
  # what it does here (a GitHub release, a signature naming this tag) installs
  # accept only with the tag attestation checked above, and auto-release.yml
  # does the AWS part from main.
  publish:
    name: Sign and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.check.outputs.path == 'maintainer' && 'release' || '' }}
    permissions:
      contents: write # the GitHub release
      id-token: write # keyless signing and the AWS role
      attestations: write # build provenance
    env:
      TAG: ${{ needs.check.outputs.tag }}
      PUBLIC_BUCKET: coderhelm-public
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: The files are the ones the build listed
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          diff <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) <(awk '{print $2}' SHA256SUMS | sort)

      # Keyless signature of the checksums: installs and updates check it was
      # made by exactly this workflow on this tag, and logged in Rekor. The
      # cosign version matches the one the update build verifies with.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Verify the signature as an install will
        run: |
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/tags/$TAG" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            dist/SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/gateway.zip
            dist/worker.zip
            dist/mcp-proxy.zip
            dist/dashboard.tar.gz
            dist/source.tar.gz
            dist/coderhelm-selfhost.tgz
            dist/install.sh
            dist/coderhelm.json
            dist/coderhelm-native.tar.gz
            dist/models.json
            dist/coderhelm-log-reader.yaml
            dist/coderhelm-log-reader-update.yaml

      # A published release's files are never replaced: a re-run only fills in
      # a release that has no SHA256SUMS yet (one made by hand, without
      # assets), or confirms the files are already these.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Self-host release ${TAG}. Install: npx -y github:${GITHUB_REPOSITORY}#${TAG} init, then deploy. Update: npx -y github:${GITHUB_REPOSITORY}#${TAG} update --to ${TAG}. Check an install: npx -y github:${GITHUB_REPOSITORY} doctor. Verify it yourself: docs/self-host/updates-security.md."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/old"
            if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP/old" 2>/dev/null; then
              cmp -s "$RUNNER_TEMP/old/SHA256SUMS" dist/SHA256SUMS || { echo "::error::$TAG is already published with other files; a release is never replaced"; exit 1; }
              echo "$TAG is already published with these files."
            else
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" dist/* --title "$TAG" --notes "$NOTES" --verify-tag
          fi

      # CloudFormation's Launch Stack links only open templates stored in S3,
      # so the release's templates also go to the hosted deployment's public
      # bucket (infra/lib/log-analyzer-stack.ts), by version, and latest.json
      # names the newest stable one for the install guide
      # (docs.coderhelm.com/self-host/install). The template is byte for byte
      # the coderhelm.json in the signed SHA256SUMS.
      # Two roles (infra/lib/worker-stack.ts), each trusting only this file
      # on a v* tag in the "release" environment:
      #   release-publisher  creates objects under launch/v*/, never replaces
      #                      one (If-None-Match is required by its policy);
      #   release-latest     writes launch/latest.json only, conditionally,
      #                      after the published release checked out below.
      # A maintainer's tag only: auto-release.yml publishes these for its own.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: needs.check.outputs.path == 'maintainer'
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-release-publisher
          role-duration-seconds: 900
          aws-region: us-east-1
      - name: Upload the templates
        if: needs.check.outputs.path == 'maintainer'
        run: |
          # Written once: a file already there must be this one.
          put() {
            if curl --proto =https -fsSL -o "$RUNNER_TEMP/existing" "https://$PUBLIC_BUCKET.s3.amazonaws.com/$2"; then
              cmp -s "$RUNNER_TEMP/existing" "$1" || { echo "::error::$2 already holds another file"; exit 1; }
            else
              aws s3api put-object --bucket "$PUBLIC_BUCKET" --key "$2" --body "$1" --if-none-match '*' --content-type "$3" --cache-control "public, max-age=31536000, immutable" >/dev/null
            fi
          }
          for f in coderhelm-log-reader.yaml coderhelm-log-reader-update.yaml; do put "dist/$f" "launch/$TAG/$f" text/yaml; done
          # The native files, each checked against the sha256 coderhelm.json pins, then the parent last.
          mkdir -p "$RUNNER_TEMP/native" && tar -xzf dist/coderhelm-native.tar.gz -C "$RUNNER_TEMP/native"
          # shellcheck disable=SC2016 # JavaScript, not shell
          node -e '
            const fs = require("fs"), c = require("crypto");
            const t = JSON.parse(fs.readFileSync("dist/coderhelm.json", "utf8"));
            for (const f of t.Resources.ReleaseAssets.Properties.Files) {
              const got = c.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP + "/native/" + f.Key)).digest("hex");
              if (got !== f.Sha256) { console.error(`${f.Key} is not the file coderhelm.json pins`); process.exit(1); }
              console.log(f.Key);
            }' > "$RUNNER_TEMP/native-files"
          while read -r k; do
            case "$k" in *.json) ct=application/json ;; *) ct=application/zip ;; esac
            put "$RUNNER_TEMP/native/$k" "launch/$TAG/$k" "$ct"
          done < "$RUNNER_TEMP/native-files"
          put dist/coderhelm.json "launch/$TAG/coderhelm.json" application/json

      # The published release, downloaded from GitHub, checks out as an
      # install checks it: the signature, from this tag's commit, and every
      # file against SHA256SUMS. Only then does latest.json move.
      - name: Verify the published release
        if: ${{ needs.check.outputs.path == 'maintainer' && !contains(needs.check.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/published" && mkdir -p "$d"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$d"
          cosign verify-blob --bundle "$d/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "refs/tags/$TAG" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$d/SHA256SUMS"
          (cd "$d" && sha256sum -c SHA256SUMS)
          curl --proto =https -fsSL "https://$PUBLIC_BUCKET.s3.amazonaws.com/launch/$TAG/coderhelm.json" | cmp -s - "$d/coderhelm.json" \
            || { echo "::error::the template in S3 is not the signed coderhelm.json"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: ${{ needs.check.outputs.path == 'maintainer' && !contains(needs.check.outputs.tag, '-') }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-release-latest
          role-duration-seconds: 900
          aws-region: us-east-1
      # Pre-releases (v1.2.3-rc.1) are published by version but never become
      # latest, and latest.json only ever moves forward. The write is
      # conditional: a create, or a replace of the exact copy read (ETag).
      - name: Move latest.json
        if: ${{ needs.check.outputs.path == 'maintainer' && !contains(needs.check.outputs.tag, '-') }}
        run: |
          headers="$RUNNER_TEMP/latest.headers"
          current=$(curl --proto =https -fsSL -D "$headers" "https://$PUBLIC_BUCKET.s3.amazonaws.com/launch/latest.json" 2>/dev/null || echo '{}')
          etag=$(sed -n 's/^[Ee][Tt][Aa][Gg]: *//p' "$headers" 2>/dev/null | tr -d '\r' | head -n1)
          # shellcheck disable=SC2016 # JavaScript, not shell
          CURRENT="$current" SHA=$(sha256sum dist/coderhelm.json | cut -d' ' -f1) node -e '
            const tag = process.env.TAG;
            const n = (v) => String(v || "v0.0.0").replace(/^v/, "").split(/[.-]/).slice(0, 3).map(Number);
            let cur = {};
            try { cur = JSON.parse(process.env.CURRENT); } catch {}
            const [a, b] = [n(tag), n(cur.version)];
            const newer = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];
            if (!newer && cur.version !== tag) { console.error(`latest.json names ${cur.version}, newer than ${tag}: left as it is`); process.exit(0); }
            const bucket = process.env.PUBLIC_BUCKET;
            require("fs").writeFileSync("latest.json", JSON.stringify({
              version: tag,
              templateUrl: `https://${bucket}.s3.amazonaws.com/launch/${tag}/coderhelm.json`,
              templateSha256: process.env.SHA,
              publishedAt: new Date().toISOString(),
            }));
          '
          [ -f latest.json ] || exit 0
          if [ -n "$etag" ]; then
            aws s3api put-object --bucket "$PUBLIC_BUCKET" --key launch/latest.json --body latest.json --if-match "$etag" --content-type application/json --cache-control "public, max-age=300" >/dev/null
          else
            aws s3api put-object --bucket "$PUBLIC_BUCKET" --key launch/latest.json --body latest.json --if-none-match '*' --content-type application/json --cache-control "public, max-age=300" >/dev/null
          fi
