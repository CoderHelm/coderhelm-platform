name: Release

# A tag vX.Y.Z publishes a self-host release: prebuilt Lambda code (no Rust
# toolchain needed to install), the dashboard build, the CDK app's source,
# the installer, the install script and the Launch Stack template (also
# published to S3 for the Launch Stack link), with
# SHA256SUMS and build provenance (GitHub artifact attestations: Sigstore,
# no keys to manage). The hosted deployment is not touched by this workflow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      # The updater and the installer compare versions: a release must sort
      # above every earlier one, including the v0.2.x to v0.6.0 tags from
      # before self-hosting (they have no releases). The first self-host
      # release is v0.7.0. The installer's version must match the tag, and
      # MIGRATIONS.json must be valid JSON.
      - name: Check the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node -e '
            const tag = process.env.TAG;
            const m = tag.match(/^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$/);
            if (!m) { console.error(`${tag} is not vX.Y.Z`); process.exit(1); }
            const n = (v) => v.replace(/^v/, "").split(/[.-]/).slice(0, 3).map(Number);
            const [a, b] = [n(tag), n("v0.6.0")];
            const above = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];
            if (!above) { console.error(`${tag} must sort above v0.6.0 (the last tag from before self-hosting); the first self-host release is v0.7.0`); process.exit(1); }
            const pkg = require("./installer/package.json").version;
            if (`v${pkg}` !== tag.replace(/-.*/, "") && `v${pkg}` !== tag) console.log(`note: installer/package.json says ${pkg}; the release stamps ${tag}`);
            require("./selfhost/MIGRATIONS.json");
          '

      # ── Rust Lambdas ───────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
      - uses: mlugg/setup-zig@v2
      - run: pip3 install --retries 3 --timeout 60 cargo-zigbuild
      - name: Build gateway and worker
        working-directory: services
        run: cargo zigbuild --workspace --release --target aarch64-unknown-linux-musl
      - name: Package Lambdas
        run: |
          mkdir -p dist
          for b in gateway worker; do
            cp services/target/aarch64-unknown-linux-musl/release/$b bootstrap
            zip -q -X dist/$b.zip bootstrap
            rm bootstrap
          done

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ── MCP proxy ──────────────────────────────────────────────────
      - name: Build the MCP proxy
        working-directory: lambda/mcp-proxy
        run: npm ci && npm run build && (cd dist && zip -q -r -X ../../../dist/mcp-proxy.zip .)

      # ── Dashboard (the commit selfhost/versions.json names) ────────
      - name: Pick the dashboard commit
        id: dash
        run: echo "ref=$(node -p 'require("./selfhost/versions.json").dashboardRef')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: CoderHelm/coderhelm
          ref: ${{ steps.dash.outputs.ref }}
          path: dashboard-src
      - name: Build the dashboard
        working-directory: dashboard-src/dashboard
        # No API URL baked in: a self-hosted deployment serves
        # runtime-config.js next to the pages (infra/lib/web-stack.ts).
        env:
          NEXT_PUBLIC_SELF_HOSTED: "1"
        run: |
          npm ci
          npm run build
          test -f out/index.html
          tar -czf "$GITHUB_WORKSPACE/dist/dashboard.tar.gz" -C out .

      # ── Source, installer, script, template ────────────────────────
      - name: Source and installer
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # The source, plus the release stamp each install shows (Settings, then System).
          SRC="$RUNNER_TEMP/src/coderhelm-platform-${TAG#v}"
          mkdir -p "$SRC" && git archive --format=tar "$TAG" | tar -x -C "$SRC"
          printf '{"version":"%s","commit":"%s","releasedAt":"%s"}\n' "$TAG" "$(git rev-parse "$TAG^{commit}")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$SRC/selfhost/release.json"
          tar -czf dist/source.tar.gz -C "$RUNNER_TEMP/src" "coderhelm-platform-${TAG#v}"
          (cd installer && npm version --no-git-tag-version --allow-same-version "${TAG#v}" >/dev/null && npm pack --silent --pack-destination ../dist >/dev/null)
          mv dist/coderhelm-selfhost-*.tgz dist/coderhelm-selfhost.tgz
          cp selfhost/install.sh dist/install.sh
          # The Launch Stack template, pinned to this release, and the
          # installer its CodeBuild project runs (checked against SHA256SUMS).
          node selfhost/launch/stamp-template.mjs infra/cfn/coderhelm-selfhost-launch.yaml "$TAG" > dist/launch-stack.yaml
          cp selfhost/launch/bootstrap.mjs dist/launch-bootstrap.mjs
          (cd dist && sha256sum gateway.zip worker.zip mcp-proxy.zip dashboard.tar.gz source.tar.gz coderhelm-selfhost.tgz install.sh launch-stack.yaml launch-bootstrap.mjs > SHA256SUMS)
          cat dist/SHA256SUMS

      # The release's own CDK app synthesizes for a fresh self-host config.
      - name: Synth check
        working-directory: infra
        env:
          GATEWAY_ZIP: ${{ github.workspace }}/dist/gateway.zip
          WORKER_ZIP: ${{ github.workspace }}/dist/worker.zip
          MCP_PROXY_DIR: ${{ github.workspace }}/dist/mcp-proxy.zip
        run: |
          npm ci
          mkdir -p "$RUNNER_TEMP/dash" && tar -xzf ../dist/dashboard.tar.gz -C "$RUNNER_TEMP/dash"
          CODERHELM_DASHBOARD_DIR="$RUNNER_TEMP/dash" npx cdk synth --all --quiet -c config=config/selfhost.example.json -o "$RUNNER_TEMP/synth"

      # Keyless signature of the checksums: the update build and the
      # installer check it was made by this workflow, on a tag.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/gateway.zip
            dist/worker.zip
            dist/mcp-proxy.zip
            dist/dashboard.tar.gz
            dist/source.tar.gz
            dist/coderhelm-selfhost.tgz
            dist/launch-bootstrap.mjs
            dist/launch-stack.yaml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="Self-host release ${TAG}. Install: npx -y github:${GITHUB_REPOSITORY}#${TAG} init, then deploy. Update: npx -y github:${GITHUB_REPOSITORY}#${TAG} update --to ${TAG}. Check an install: npx -y github:${GITHUB_REPOSITORY} doctor. See docs/self-host."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES" --verify-tag
          fi

  # CloudFormation's Launch Stack links only open templates stored in S3, so
  # the release's template also goes to the hosted deployment's public bucket
  # (infra/lib/log-analyzer-stack.ts), by version, and latest.json names the
  # newest stable one for the install guide (docs.coderhelm.com/self-host/install).
  # A separate job: the GitHub release is published even if this one fails,
  # and re-running it later is safe.
  launch-template:
    name: Publish the Launch Stack template
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_BUCKET: coderhelm-public
    steps:
      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # The role only tag builds of this repository may assume, and only to
      # write launch/* in the public bucket (infra/lib/worker-stack.ts,
      # ReleasePublisherRole). The hosted deploy creates it.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/coderhelm-prod-release-publisher
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: Upload the template and latest.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node selfhost/launch/stamp-template.mjs infra/cfn/coderhelm-selfhost-launch.yaml "$TAG" > launch.yaml
          aws s3 cp launch.yaml "s3://$PUBLIC_BUCKET/launch/$TAG/coderhelm-launch.yaml" --content-type text/yaml --cache-control "public, max-age=31536000, immutable"
          # Pre-releases (v1.2.3-rc.1) are published by version but never become latest.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node -e 'import("./selfhost/launch/stamp-template.mjs").then(m=>process.stdout.write(JSON.stringify(m.latestDoc(process.argv[1]))))' "$TAG" > latest.json
            aws s3 cp latest.json "s3://$PUBLIC_BUCKET/launch/latest.json" --content-type application/json --cache-control "public, max-age=300"
          fi
