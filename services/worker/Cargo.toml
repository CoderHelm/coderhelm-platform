[package]
name = "worker"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
common = { path = "../common" }
# Lambda runtime
lambda_runtime = "0.13"
tokio = { version = "1", features = ["full"] }
aws_lambda_events = { version = "0.15", default-features = false, features = ["sqs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-codebuild = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-route53 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# log_evidence: the ECS service, task definition and tasks behind a log group (read only)
aws-sdk-ecs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# infra_inventory: which versions run in a team's account (describe and list
# calls only, through its log reader role when the team switched it on)
aws-sdk-ec2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-autoscaling = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticloadbalancingv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eks = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticache = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-opensearch = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# infra_inventory, when a team turns them on: Amazon Inspector findings and
# AWS Health events (read-only)
aws-sdk-inspector2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-health = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1"

# HTTP client (GitHub API, Jira API)
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Auth
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Agent memory
mentedb = "=0.41.0"
mentedb-core = "=0.41.0"
mentedb-embedding = "=0.41.0"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
# e2e: GitHub Actions artifacts are zip files
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"

# Code graph extraction (tree-sitter grammars are C, compiled via cc — works
# under cargo-zigbuild for the musl Lambda target)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"

# Utils
ulid = "1"
thiserror = "2"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
rsa = "0.9"
urlencoding = "2"
url = "2"
regex = "1"
serde_yaml = "0.9"
toml = "0.8"
