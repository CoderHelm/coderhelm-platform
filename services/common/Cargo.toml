[package]
name = "common"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
sha2 = "0.10"
# unsubscribe: signed links in emails
hmac = "0.12"
# memlock: the shared memory fencing lock (worker runs + gateway deletes)
aws-sdk-dynamodb = "1"
# mail: one send layer for SES and the hybrid email relay
aws-sdk-sesv2 = "1"
chrono = "0.4"
ulid = "1"
tracing = "0.1"
# alert_notify: Teams cards for alerts
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# model_stream: Anthropic SSE responses read as they arrive
futures = "0.3"
# usage: a call whose counters could not be written waits on the tickets queue
aws-sdk-sqs = "1"
# plugins: one-off and recurring schedules (publish at a time, schedule triggers)
aws-sdk-scheduler = "1"
# plugins: Slack request signatures
hex = "0.4"
# embed: Titan embeddings on CoderHelm's own AWS account, metered
aws-sdk-bedrockruntime = "1"
tokio = { version = "1", features = ["macros", "time", "net", "rt", "sync"] }
# live: read-only lookups against a team's own systems
graphql-parser = "0.4"
url = "2"
aws-sdk-kms = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# mcp_remote: PKCE verifiers and OAuth state values
rand = "0.9"
serde = { version = "1", features = ["derive"] }
# live: a team's AWS account (logs and databases), through a role it creates
aws-sdk-sts = "1"
aws-sdk-rdsdata = "1"
aws-sdk-redshiftdata = "1"
aws-sdk-cloudwatchlogs = "1"
# live: CloudWatch metrics and Airflow (MWAA) through the team's log reader role
aws-sdk-cloudwatch = "1"
# log_repo: which repo a log group's code lives in (read-only lookups)
aws-sdk-ecs = "1"
aws-sdk-lambda = "1"
aws-sdk-cloudformation = "1"
aws-sdk-ecr = "1"
aws-sdk-iam = "1"
aws-sdk-mwaa = "1"
# public_urls: the deployment's URL when CloudFront picked it (single origin)
aws-sdk-ssm = "1"
aws-smithy-types = "1"
# live: fakes stand in for the HTTP and AWS calls in tests
async-trait = "0.1"
sqlparser = { version = "0.59", features = ["visitor"] }
regex = "1"
# agent_policy: links in approval and sign-in messages
urlencoding = "2"
# e2e: Playwright HTML reports carry their results as an embedded zip
zip = { version = "2", default-features = false, features = ["deflate"] }
# live::tools: tool definitions written as YAML in a repo
serde_yaml = "0.9"
# e2e: JUnit XML test reports
quick-xml = "0.37"
aws-sdk-s3 = "1"
lopdf = { version = "0.46", default-features = false }
yaml-rust2 = "0.10"

[dev-dependencies]
# model_retry: a local fake server in the tests
tokio = { version = "1", features = ["macros", "time", "net", "rt", "rt-multi-thread", "io-util", "sync"] }
# live: the ignored tests against a real AWS account
aws-config = { version = "1", features = ["behavior-version-latest"] }
