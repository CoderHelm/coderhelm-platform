[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
# memlock: the shared memory fencing lock (worker runs + gateway deletes)
aws-sdk-dynamodb = "1"
chrono = "0.4"
ulid = "1"
tracing = "0.1"
# alert_notify: Teams cards for alerts
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "time", "net"] }
# live: read-only lookups against a team's own systems
graphql-parser = "0.4"
url = "2"
aws-sdk-kms = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# live: a team's AWS account (logs and databases), through a role it creates
aws-sdk-sts = "1"
aws-sdk-rdsdata = "1"
aws-sdk-redshiftdata = "1"
aws-sdk-cloudwatchlogs = "1"
sqlparser = { version = "0.59", features = ["visitor"] }
regex = "1"
# e2e: Playwright HTML reports carry their results as an embedded zip
zip = { version = "2", default-features = false, features = ["deflate"] }
# e2e: JUnit XML test reports
quick-xml = "0.37"

[dev-dependencies]
# live: the ignored tests against a real AWS account
aws-config = { version = "1", features = ["behavior-version-latest"] }
