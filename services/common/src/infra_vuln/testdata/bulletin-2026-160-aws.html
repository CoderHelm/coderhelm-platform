<!doctype html><html><head><title>CVE-2026-98432 - Linux kernel IPv4 TCP use-after-free Issue</title></head><body><div data-eb-tpl-ns="awsmRT"><script type="application/json">{"data": {"items": [{"fields": {"id": "ams#c1", "itemHeading": "CVE-2026-98432 - Linux kernel IPv4 TCP use-after-free Issue", "itemLongLoc": "<p><b>Bulletin ID:</b> 2026-160-AWS<br><b>Scope:</b> AWS<br><b>Content Type:</b> Important (requires attention)<br><b>Publication Date:</b>&nbsp;10/30/2026 22:15 PM PDT<br><b>Last Updated Date:</b> 11/10/2026 13:45 PM PST</p>\n<h3><b>Summary:</b></h3>\n<p>AWS is aware of <a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-98432\" target=\"_blank\" rel=\"noopener noreferrer\">CVE-2026-98432</a>, a memory issue in the Linux kernel IPv4 TCP handshake path affecting kernel versions 4.4 and later. Under specific conditions, a remote, unauthenticated third-party can send crafted IPv4 TCP packets that carry IP options to an affected listener. This results in a kernel crash, disclosure of kernel memory, or memory corruption. Researchers have demonstrated unauthenticated remote code execution against hosts with a Multipath TCP (MPTCP) listener. We have no evidence that this issue has been leveraged at this time. We will update this bulletin as more information becomes available.</p>\n<h3>Current Mitigation Status:</h3>\n<p><b>Amazon Linux</b></p>\n<p>Amazon Linux 2 and Amazon Linux 2023 kernel packages for the resolution of CVE-2026-98432 are available. Customers should update their kernel packages and reboot. Kernel versions kernel-4.14, kernel-5.4, kernel-5.10, kernel-5.15, kernel-6.1, kernel-6.12, &amp; kernel-6.18: Available now.</p>\n<p>Advisories: <a href=\"https://alas.aws.amazon.com/ALAS-2026-4065.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2-2026-4065</a>, <a href=\"https://alas.aws.amazon.com/AL2/ALASKERNEL-5.4-2026-135.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2KERNEL-5.4-2026-135</a>, <a href=\"https://alas.aws.amazon.com/AL2/ALASKERNEL-5.10-2026-137.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2KERNEL-5.10-2026-137</a>,&nbsp;<a href=\"https://alas.aws.amazon.com/AL2/ALASKERNEL-5.15-2026-120.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2KERNEL-5.15-2026-120</a>, <a href=\"https://alas.aws.amazon.com/AL2023/ALAS-2026-3365.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2023-2026-3365</a>,&nbsp;<a href=\"https://alas.aws.amazon.com/AL2023/ALAS-2026-3335.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2023-2026-3335</a>, <a href=\"https://alas.aws.amazon.com/AL2023/ALAS-2026-3251.html\" target=\"_blank\" rel=\"noopener noreferrer\">ALAS2023-2026-3251</a>.</p>\n<p>To update:</p>\n<table cellpadding=\"8\" cellspacing=\"0\" border=\"1\">\n <tbody>\n  <tr>\n   <td><p># Amazon Linux 2<br>sudo yum update kernel &amp;&amp; sudo reboot</p><p># Amazon Linux 2023 Kernel 6.1<br>sudo dnf update kernel --releasever=latest &amp;&amp; sudo reboot</p><p># Amazon Linux 2023 Kernel 6.12<br>sudo dnf update kernel6.12 --releasever=latest &amp;&amp; sudo reboot</p><p># Amazon Linux 2023 Kernel 6.18<br>sudo dnf update kernel6.18 --releasever=latest &amp;&amp; sudo reboot</p></td>\n  </tr>\n </tbody>\n</table>\n<p>Amazon Linux 2023 instances that are locked to a release version must use release 2023.12.20261102 or later to receive the updated kernel.</p>\n<p><b>Amazon EC2</b></p>\n<p>Customers running self-managed Linux instances on Amazon EC2 are responsible for updating the kernel on those instances. If you run Amazon Linux, update the kernel package as described above. If you run another Linux distribution, follow your distribution's guidance for applying the fix when it becomes available.</p>\n<p>After updating the kernel, a reboot is required for the fix to take effect. A kernel update and reboot is the only complete remediation for this issue.</p>\n<p><b>AWS Web Application Firewall, Application Load Balancer, Classic Load Balancer, TLS Listeners on Network Load Balancer, Amazon CloudFront, Amazon API Gateway</b></p>\n<p>Customers using the above services do not receive TCP connections from untrusted sources directly when following best practices. AWS is applying updates to the underlying infrastructure of these services and no immediate customer action is required if you are using these services. We still recommend customers update their self-managed instances behind these services within the next 30 days.</p>\n<p><b>AWS Global Accelerator</b></p>\n<p>Global Accelerator does not support IP options on IPv4 TCP packets. All incoming packets containing IP options are dropped by Global Accelerator's data plane before any connection is processed. As such, Global Accelerator's data plane itself and all endpoints behind Global Accelerator are not affected by this issue.</p>\n<p><b>Amazon EKS</b></p>\n<p>The Amazon EKS-managed Kubernetes control plane has been updated to address this issue. No customer action is required for the EKS control plane.</p>\n<p>Amazon EKS has released updated EKS-optimized Amazon Linux 2023 AMIs&nbsp;(<a href=\"https://github.com/awslabs/amazon-eks-ami/releases/tag/v20261031\" target=\"_blank\" rel=\"noopener noreferrer\">release v20261031</a>) that address this issue. Customers using managed node groups, self-managed nodes, or Karpenter with these AMIs should update their nodes to v20261031 or later.</p>\n<p>Amazon EKS released updated EKS Auto Mode AMIs on October 31, 2026. EKS Auto Mode automatically replaces existing nodes with nodes running the updated AMI, subject to your NodePool disruption budgets. No customer action is required for EKS Auto Mode. EKS Auto Mode AMIs are named in the form \"Bottlerocket (EKS Auto, Standard) 2026.10.31\". To check which AMI your nodes are running, run the command `kubectl get node -o wide` and compare the OS-IMAGE column.</p>\n<p>Amazon EKS Fargate Pods launched after November 1, 2026, 9:00 AM PST (November 1, 2026, 5:00 PM UTC) run on the patched platform. Amazon EKS replaces pods that were already running within 14 days as part of our routine&nbsp;<a href=\"https://docs.aws.amazon.com/eks/latest/userguide/fargate-pod-patching.html\" target=\"_blank\" rel=\"noopener noreferrer\">patching cycle</a>.</p>\n<p><b>ElastiCache</b></p>\n<p>We are deploying mitigations worldwide to prevent exploitation on your caches.&nbsp;The long-term remediation will be for you to apply a <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Self-Service-Updates.html\" target=\"_blank\" rel=\"noopener noreferrer\">self-service update</a>&nbsp;to your ElastiCache clusters named either elasticache-20261106-arm or elasticache-20261106-intel, which is now available.</p>\n<p><b>MemoryDB</b></p>\n<p>We are deploying mitigations worldwide to prevent exploitation on your databases.&nbsp;The long-term remediation will be for you to apply a&nbsp;<a href=\"https://docs.aws.amazon.com/memorydb/latest/devguide/service-updates.html\" target=\"_blank\" rel=\"noopener noreferrer\">self-service update</a>&nbsp;to your MemoryDB clusters named memorydb-20261106-arm, which is now available.</p>\n<p><b>AWS RTB Fabric</b></p>\n<p>RTB Fabric gateways terminate inbound TCP connections and open separate connections to customer endpoints, so IPv4 packets carrying IP options are not passed through to the endpoints that receive traffic from RTB Fabric. AWS has completed updates to the underlying infrastructure of RTB Fabric, and no customer action is required for RTB Fabric. Customers running self-managed Linux instances, including endpoints that send or receive traffic through RTB Fabric, are responsible for updating the kernel on those instances as described for Amazon EC2 above.</p>\n<p><b>AWS Elastic Beanstalk</b></p>\n<p>Elastic Beanstalk platforms based on Amazon Linux 2023 use affected kernel versions. Elastic Beanstalk Windows Server platforms are not affected.</p>\n<p>Elastic Beanstalk has released Amazon Linux 2023 platform versions that include the patched kernel. These platform versions were released on November 4, 2026, and use AMI version 2023.12.20261102. For details, see the&nbsp;<a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/relnotes\" target=\"_blank\" rel=\"noopener noreferrer\">Elastic Beanstalk release notes</a>. Environments with managed platform updates enabled update to the patched version during their next maintenance window. For other environments,&nbsp;<a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.platform.upgrade.html\" target=\"_blank\" rel=\"noopener noreferrer\">update the platform version</a>.</p>\n<p>If you can't update your platform version right away, update the kernel on your environment's instances and reboot, as described in the Amazon Linux section above. Instances that Elastic Beanstalk launches later, for example when scaling out or replacing an instance, start from the platform AMI. They need the same update until your environment runs the patched platform version.<br></p>\n<p><b>Amazon ECS</b></p>\n<p>Customers running ECS on EC2 should update the kernel on their container instances and reboot, or replace them with instances launched from the latest ECS-optimized AMI (release 20261031).</p>\n<p>Fargate: AWS has released a patched platform version. All new tasks launched after November 1, 2026, 9:00 AM PST (November 1, 2026, 5:00 PM UTC) use the patched platform version. Existing tasks are retired per your task retirement settings, or you can replace them sooner as described in&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-maintenance.html\" target=\"_blank\" rel=\"noopener noreferrer\">Task retirement and maintenance for AWS Fargate</a>.</p>\n<p>ECS Managed Instances: AWS has released an updated AMI, and new instances launched after the same time use the patched AMI. Existing instances are drained 14 days after launch, or earlier to align with your event windows (<a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-instance-patching.html\" target=\"_blank\" rel=\"noopener noreferrer\">Patching in Amazon ECS Managed Instances</a>). To update immediately, drain them manually.</p>\n<p><b>Bottlerocket</b></p>\n<p>The patched Bottlerocket kernel has been released. Updated Bottlerocket AMIs&nbsp;<a href=\"https://github.com/bottlerocket-os/bottlerocket/releases/tag/v1.68.1\" target=\"_blank\" rel=\"noopener noreferrer\">bottlerocket v1.68.1</a>&nbsp;with the patched kernel were released on 10/31.</p>\n<p><b>AWS Lambda</b></p>\n<p>Lambda workloads are not affected by this issue. CVE-2026-98432 requires an actor to send a specially crafted network packet to a publicly reachable IPv4 TCP port on an affected host. Lambda functions do not have public IPv4 TCP ports, so there is no path for an external party to reach your function's execution environment with the type of traffic needed to trigger this issue. No action is required on your part.</p>\n<p>As a defense-in-depth measure, we are proactively applying the kernel patch to the Lambda service infrastructure.</p>\n<p><b>Amazon Lightsail</b></p>\n<p>Customers running self-managed Linux instances on Amazon Lightsail are responsible for updating the kernel on those instances. If you run Amazon Linux, update the kernel package as described above. If you run another Linux distribution, follow your distribution's guidance for applying the fix when it becomes available.</p>\n<p>After updating the kernel, a reboot is required for the fix to take effect. A kernel update and reboot is the only complete remediation for this issue.</p>\n<p><b>VPC Endpoints (PrivateLink)</b></p>\n<p>Customers running Linux targets behind AWS PrivateLink endpoint services should update the kernel on those targets and reboot, or apply the interim steps below until they can.</p>\n<p><b>VPC Lattice</b></p>\n<p>Customers running Layer 4 (TCP) targets on Linux behind VPC Lattice should update the kernel on those targets and reboot, or apply the interim steps provided below until they can.</p>\n<p><b>RDS/Aurora</b></p>\n<p>RDS/Aurora customers should verify that their database ports are not accessible from the internet. Additionally, we have fully deployed a worldwide mitigation to address this issue on your database hosts. Long term remediation will be for you to patch your database OS. This patch is now available for you to apply.</p>\n<p><b>Neptune</b></p>\n<p>Neptune customers should verify that their database ports are not accessible from the internet.</p>\n<p><b>Redshift</b></p>\n<p>All Redshift customers have been mitigated for this CVE.</p>\n<p><b>Storage Gateway</b></p>\n<p>Storage Gateway has provided updated releases for all supported gateways. This update is immediately available for a manual update through the AWS Console and API. This update will apply automatically based on the maintenance window. We recommend that you perform a manual update now to expedite the patching of your gateway.</p>\n<p><b>AWS Cloud9</b></p>\n<p>AWS Cloud9 EC2 environments install Amazon Linux and Ubuntu updates automatically, but an updated kernel takes effect only after the environment restarts. After the update installs, customers should restart each environment's EC2 instance, or stop the environment and start it again. Canonical has not yet released a fixed kernel for Ubuntu. Customers using Ubuntu environments should restart them after the fixed kernel installs. Customers using AWS Cloud9 SSH environments are responsible for updating the kernel on their own servers.</p>\n<p><b>Amazon GameLift</b></p>\n<p>Amazon GameLift Servers has released updated Amazon Linux 2 and Amazon Linux 2023 AMIs that address this issue in all Regions. Container fleets created after November 2, 2026, 1:06 PM PST (November 2, 2026, 9:06 PM UTC), and managed EC2 fleets created after November 2, 2026, 5:55 PM PST (November 3, 2026, 1:55 AM UTC), use the updated AMIs which have mitigated this CVE. Customers using container or managed EC2 fleets created before these times should create a new fleet, move their game session traffic to it, for example by updating their game session queue destinations or aliases, and then delete the old fleet. Existing fleets continue to use the AMI they were created with and cannot be updated to mitigate this CVE preemptively for newly launched instances - recreating the fleet is the only mechanism to fully mitigate this risk. Fleets running Windows are not affected by this issue. Customers using Anywhere fleets manage their own operating system and should update the kernel and reboot, as described for Amazon EC2 above.</p>\n<p><b>Amazon GameLift Streams</b></p>\n<p>Amazon GameLift Streams offers Ubuntu Linux-based runtime environments as an option to customers for executing their applications. Pending updates from Canonical will be released to customers when they become available. No action is required at this time.</p>\n<p><b>Amazon WorkSpaces</b></p>\n<p>Amazon WorkSpaces Windows bundles are not affected by this issue. Linux WorkSpaces use affected Linux kernels and should be updated as fixed kernels become available from the applicable operating system vendor.</p>\n<p>In the default WorkSpaces configuration, Linux WorkSpaces do not accept inbound connections from outside the WorkSpace, and the default WorkSpaces security group allows no inbound access. Customer impact increases if customers have opened inbound ports to Linux WorkSpaces, such as SSH, or run their own TCP services, especially MPTCP-enabled services.</p>\n<p>Amazon WorkSpaces Personal instances with Amazon Linux 2 can receive the fixed Amazon Linux kernel through existing WorkSpaces maintenance mechanisms. Customers should ensure Linux WorkSpaces can reach their operating system update repositories and should restart WorkSpaces after fixed kernels are installed so the updated kernel is active.</p>\n<p>Amazon WorkSpaces Applications fleets and image builders with Amazon Linux 2 can receive the fixed Amazon Linux kernel by creating an updated image through the AWS CLI or SDK, or by launching and updating an existing image builder or image, and then creating a new image from that. In both cases, customers should finish by updating their fleets to use the new image.</p>\n<p>For third-party Linux distributions such as Ubuntu, Red Hat Enterprise Linux, and Rocky Linux, fixed kernel availability depends on the respective operating system vendor. Customers should monitor their vendor's advisories and apply updates when available. On Amazon WorkSpaces Personal instances running Ubuntu, installing a fixed kernel may not protect the running WorkSpace until the WorkSpace is restarted, unless the vendor provides an applicable livepatch that is installed and active.</p>\n<p>AutoStop WorkSpaces that are stopped are not running and cannot be affected while stopped; they will need to install updates and restart after they next start or during their maintenance window. Customers who disabled maintenance mode or restrict repository access should verify that updates are being applied.</p>\n<p>Newly provisioned Linux WorkSpaces Personal instances install available operating system updates during provisioning. After fixed kernels are available from the relevant OS repository, newly created Linux WorkSpaces should start with the available fixed kernel after provisioning completes.</p>\n<p><b>AWS Database Migration Service (AWS DMS)</b></p>\n<p>AWS DMS replication instances, including those that run AWS DMS Serverless replications, do not accept inbound connections from customer networks or the internet, so there is no path for an external party to send them the traffic needed to trigger this issue.</p>\n<p>As a defense-in-depth measure, AWS DMS will apply the patched kernel to all replication instances and to AWS DMS Serverless replications. The update will be available in all AWS Regions by November 2, 2026. AWS DMS will apply it during a weekly maintenance window, with a reboot. During the reboot, running tasks pause and resume, and tables still in full load restart. To choose when this happens, change the replication instance's maintenance window.</p>\n<p>To get the update sooner, check whether `aws dms describe-pending-maintenance-actions` lists an os-patch action for your replication instance. If it does, apply it now. This reboots the instance right away:</p>\n<table cellpadding=\"8\" cellspacing=\"0\" border=\"1\">\n <tbody>\n  <tr>\n   <td>aws dms apply-pending-maintenance-action --replication-instance-arn &lt;ARN&gt; --apply-action os-patch --opt-in-type immediate</td>\n  </tr>\n </tbody>\n</table>\n<p><b>Amazon MQ</b></p>\n<p>Amazon MQ has released an updated host image with the patched kernel for Amazon MQ for RabbitMQ and Amazon MQ for ActiveMQ. Brokers created after November 2, 2026, 12:16 UTC use the patched kernel. Existing brokers are updated automatically during their next scheduled maintenance window, and no customer action is required. To apply the update sooner, change the broker's maintenance window to an earlier time. Rebooting a broker does not apply this update. For more information, see&nbsp;<a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-editing-broker-preferences.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scheduling the maintenance window for an Amazon MQ broker</a>.</p>\n<p><b>AWS CodeBuild</b></p>\n<p>CodeBuild Linux build hosts run affected kernel versions. The kernel belongs to the build host, not the build image, so all Linux builds are affected whatever image they use.</p>\n<ul>\n <li>On-demand fleets: Updated x86_64 build host AMIs are deployed in all commercial Regions as of 2026-11-05. They run kernel 4.14.355-287.758 on Amazon Linux 2 and 6.1.189-236.400 on Amazon Linux 2023. Updated ARM (aarch64) AMIs are deployed in all commercial Regions as of 2026-11-06. No customer action is required.</li>\n <li>Reserved capacity fleets: Updated AMIs for x86_64 and ARM fleets, with both container compute and EC2 compute, are deployed in all commercial Regions as of 2026-11-09. If your fleet uses a&nbsp;<a href=\"https://docs.aws.amazon.com/codebuild/latest/userguide/fleets.html#fleets.custom-ami\" target=\"_blank\" rel=\"noopener noreferrer\">custom AMI</a>,&nbsp;rebuild it with the patched kernel and update the fleet to use the new AMI.</li>\n</ul>\n<p>You don't need to change build images or buildspecs. To check which kernel a build ran on, add uname -r to your buildspec.</p>\n<p><b>AWS Deep Learning AMI (DLAMI)</b><br>&nbsp;&nbsp;<br>Amazon Linux 2023 DLAMIs: Updated DLAMIs with the patched kernel (kernel6.12 6.12.113-138.209) have been released. For details, see the&nbsp;<a href=\"https://docs.aws.amazon.com/dlami/latest/devguide/appendix-ami-release-notes.html\" target=\"_blank\" rel=\"noopener noreferrer\">DLAMI release notes</a> (for example, <a href=\"https://docs.aws.amazon.com/dlami/latest/devguide/aws-deep-learning-x86-base-gpu-ami-amazon-linux-2023.html\" target=\"_blank\" rel=\"noopener noreferrer\">AWS Deep Learning Base GPU AMI (Amazon Linux 2023)</a>).&nbsp;Launch new instances from the latest Amazon Linux 2023 DLAMI. To update existing instances, update the kernel and reboot:</p>\n<table cellpadding=\"1\" cellspacing=\"0\" border=\"1\">\n <tbody>\n  <tr>\n   <td>sudo dnf update kernel6.12 --releasever=latest &amp;&amp; sudo reboot</td>\n  </tr>\n </tbody>\n</table>\n<p>Ubuntu 22.04 and 26.04 DLAMIs: Updated DLAMIs with Canonical's fixed kernels are rolling out and will be available in all Regions soon. Launch new instances from the latest Ubuntu 22.04 or 26.04 DLAMI.</p>\n<p>Ubuntu 24.04 DLAMIs: Updated DLAMIs are not yet available. We will release updated Ubuntu 24.04 DLAMIs after Canonical's fixed kernel is available, and we will update this bulletin when they are released.</p>\n<p><b>AWS Parallel Computing Service (AWS PCS)</b></p>\n<p>AWS PCS has patched the Slurm controllers of all PCS clusters as of November 1, 2026. No customer action is required for the controllers.</p>\n<p>Customers are responsible for updating the kernel on the instances in their compute node groups, including login nodes. AWS PCS released updated PCS sample AMIs for Amazon Linux 2023 (x86_64 and arm64) on October 29, 2026 that include the patched kernel. These AMIs are named in the form aws-pcs-sample_ami-al2023-arm64-&lt;timestamp&gt; and aws-pcs-sample_ami-al2023-x86_64-&lt;timestamp&gt;. See <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/working-with_ami.html\" target=\"_blank\" rel=\"noopener noreferrer\">Amazon Machine Images (AMIs) for AWS PCS</a> for more information on AMIs for PCS.</p>\n<p>Customers using the PCS sample AMIs should update their compute node groups to use the latest sample AMI. Customers using their own AMIs should rebuild them with the patched kernel, or update the kernel on running instances and reboot. To reboot compute nodes without losing EC2 capacity, use Slurm's scontrol reboot command as described in <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/slurm-reboot-procedure.html\" target=\"_blank\" rel=\"noopener noreferrer\">Reboot a compute node using Slurm in AWS PCS</a>.</p>\n<p>The PCS-ready Deep Learning AMIs (DLAMIs) are based on Ubuntu 24.04, and Canonical has not yet released a fixed kernel for Ubuntu. AWS PCS will release updated PCS-ready DLAMIs when a patched DLAMI is available. Customers using Ubuntu-based AMIs should apply the interim steps provided below until a patched kernel for Ubuntu is released.</p>\n<p><b>Amazon FSx</b></p>\n<p>We are deploying mitigations worldwide to address this issue on affected Amazon FSx file systems. The long-term fix is a patch that is rolling out now and will soon reach all AWS Regions. Once the patch is available in a Region, new file systems launched there include it, and existing file systems are patched automatically during their next weekly maintenance window. No customer action is required.</p>\n<h3>Interim step for customers who cannot update immediately</h3>\n<p>Disable MPTCP by setting the kernel parameter `net.mptcp.enabled=0`, or set `GODEBUG=multipathtcp=0` for applications built with Go 1.24 or later. This step reduces the conditions for running code on a host, but it does not resolve the issue. Updating the kernel and rebooting resolves the issue.</p>\n<p>Customers can disable IP Options to mitigate this with an IP tables rule. An example is provided below:</p>\n<table cellpadding=\"8\" cellspacing=\"0\" border=\"1\">\n <tbody>\n  <tr>\n   <td>iptables -I INPUT 1 -m u32 --u32 '0&gt;&gt;24&amp;0x0f=6:15' -j DROP</td>\n  </tr>\n </tbody>\n</table>\n<p>This rule does not persist across reboots unless saved with your distribution's tooling. Amazon Linux 2023 does not include iptables by default.</p>\n<p><b>AWS Network Firewall</b></p>\n<p>AWS Network Firewall customers can mitigate by adding the following stateful rule, which drops IPv4 packets that carry IP options. Use a SID that isn't already used in their rule groups:</p>\n<table cellpadding=\"8\" cellspacing=\"0\" border=\"1\">\n <tbody>\n  <tr>\n   <td>drop ip any any -&gt; any any (msg:\"CVE-2026-98432: drop IPv4 packets carrying IP options (IHL &gt; 5)\"; ipv4.hdr; bsize:&gt;20; sid:1000001; rev:3;)</td>\n  </tr>\n </tbody>\n</table>\n<p>Your firewall policy must use strict rule order. Give this rule group a lower priority number than your allow rule groups. Traffic that your stateless rules pass skips this rule.</p>\n<p>If your policy uses default order, create a new strict-order policy and recreate your stateful rule groups in strict order. Then switch your firewall to the new policy. This changes how all your rules are evaluated and can interrupt existing connections, so test it first and monitor after the change.</p>\n<p>As an additional defense-in-depth measure, AWS is applying network-level protections related to this issue. These protections do not replace the recommended mitigations for this issue and we recommend customers continue to apply the guidance in this bulletin.</p>\n<h3><b>References:</b></h3>\n<ul>\n <li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-98432\" target=\"_blank\" rel=\"noopener noreferrer\">CVE-2026-98432</a></li>\n</ul>\n<p>Please email <a href=\"mailto:aws-security@amazon.com\">aws-security@amazon.com</a>&nbsp;with any security questions or concerns.</p>"}}]}}</script></div></body></html>
